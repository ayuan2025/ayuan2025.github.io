<script>window.BOOK={ kind: "poem", items: [{"t":"感觉（组诗）","d":"—— 一九八八年","g":null,"u":"/posts/feelings-poetry-series/","s":[["（一）"],["火柴擦燃的瞬间","那只手苍白无力","仅有的烟头燃着","离我很远很远","掌心内隐隐有丝温暖","譬如花瓣","悄悄张开","而眼看不见","只是似乎","它在背后正开着"],["烟头熄灭过后","仍然开着","都离我很远","虽然我知道","举手内便可握住","它即将凋谢的花瓣"],["（二）"],["吹笛是种呼吸","就像歌词是丽人","半遮面孔","的纱帽","笛音间落下的","不过是随手拂下的","烟尘","但你仍泪眼莹莹"],["（三）"],["我并不是说","吉它弦颤动的","都是挥不去的背影","其是曲子们","都是些自在的草类","生长着","在天空和土地深处","并且对我们无动于衷","所以我崇拜因为弦断之时","它们也毫不在意","僵硬和灵巧的手指间","都同样轻松","杂乱地丛生"],["（四）"],["午后开始落雪","一年一次的玉米和","季节安安静静呆在谷仓里","黄昏时候独自远眺","妻儿在屋内做饭嘻闹着","一切都离雪很远","我已辨认不清那片玉米地","但明年那儿仍会长着玉米","午后继续下雪","然后玉米们又将和我安静地","呆在屋子里","度过下一个冬季"],["—— 一九八八年"]],"m":""},{"t":"静物","d":"—— 一九八八年四月","g":null,"u":"/posts/still-life/","s":[["盛满水的杯子","丰满圆润","不易为人察觉","就像一些很老的歌曲","尽管它们仍像当初一样动人"],["应该感谢天气或者","其它的一些什么","譬如","流逝的日子","是它们使我满足于","一些美好而简单的事物"],["1988.4"],["—— 一九八八年四月"]],"m":""},{"t":"写诗","d":"—— 一九八八年九月","g":null,"u":"/posts/writing-poetry/","s":[["写诗需要点昏黄的灯光","一支笔 几张白纸","余下的仅仅是空白","也就是说","在爱你不爱你之间","你是惟一的选择"],["空行不太多","不太密","需要一点点偏傍部首","在难以吟颂的部分中","栽些青草","让它们安静地生长着","惟一缺憾的是","我们过长时间的凝视"],["1988.9"],["—— 一九八八年九月"]],"m":""},{"t":"剑客","d":"—— 一九八九年","g":null,"u":"/posts/swordsman/","s":[["一个爱花的人","并且认定世界上只有一种花","是要用全部生命","在刹那开放的那朵"],["有很多美丽的头颅","和鲜艳的双眼","但有人热爱凝视而且一定只看一个地方","秋后那儿发芽","他们站在风中","学会热爱鲜花","以一种落叶的方式"],["—— 一九八九年"]],"m":""},{"t":"舞池","d":"—— 一九八九年","g":null,"u":"/posts/dance-floor/","s":[["学会凝视","在歌手落寞的句与句之间","旋转于自己的裙边的 少女们","叶子般的旋转着","在她们所崇拜的情节","和秋风一样走远的歌词里","热衷凝视","掌中鱼样游着的光线","水不疾不缓","在手心稀疏河道中","开始舒展她们","掌纹一样美丽的","面庞和生命"],["—— 一九八九年"]],"m":""},{"t":"夜染雨声","d":"—— 一九八九年","g":null,"u":"/posts/night-dyed-with-the-sound-of-rain/","s":[["怀念是一种简单的情绪","好同抚摸过久的木桌上","现出美丽的花纹"],["夜是只温暖的手","适合于些脆弱而飘渺的感情","它们转瞬即逝","但那眼神已刻骨铭心"],["雨是抚乱的鬓发","它们淅淅沥沥触摸树叶","而树沉默无语"],["梦是最甜的话语","每个夜里同榻共枕","起身已经将它背弃"],["譬喻是种很不恰当的东西","我们难以对譬喻","进行譬喻"],["—— 一九八九年"]],"m":""},{"t":"星夜逃亡","d":"—— 一九八九年","g":null,"u":"/posts/starry-night-escape/","s":[["据说有三架直升飞机在追我们","哒哒的螺旋浆声一直没停","简直是一部惊险片的开头","我们看不到敌人","却不断逃亡","（观众们这是VBC广播网为你现场直播二名越狱暴徒正在我们脚下的密林中潜逃……）","然后正在吃晚餐的人们抬起头","看一看关于逃亡的有趣镜头","顺便欣赏一下美丽多姿的热带雨林","士兵们已经追踪在我们身后","在我们跑累想停的时候","他们鸣枪要求我们继续逃跑","逃亡于热带丛林","我们登上早已准备好的独木舟","顺流而下","逃亡于密密疏疏亚特兰河网","而电视台已开始报道","五艘快艇在追踪","三架直升飞机继续在空中巡逻","一艘驱逐舰已守住了入渡口","他妈的","我们继续划着浆","手上那只电视表里的广播微笑着说","观众们下面我们来看看那只临产的大熊猫","今天的进食情况如何"],["—— 一九八九年"]],"m":""},{"t":"艳遇","d":"—— 一九八九年","g":null,"u":"/posts/romantic-encounter/","s":[["那只是些平常的错误","就像是咖啡忘了放点糖","稍微有点苦","但你仍这般介意","我只好再尝一下","只是有点苦","如此而已","究竟有什么让你如此","恨恨看着我","加上块糖后","你用舌尖尝着","从来只会喝三合一的人","我摇了摇头","而你却突然站起来","张惶走开","拉住你小心地询问时","你却像小孩子般委屈地说","我从来不知道咖啡原来这么苦","而加上糖却如此好喝"],["—— 一九八九年"]],"m":""},{"t":"跳楼的美人","d":"—— 一九八九年","g":null,"u":"/posts/beauty-jumping-off-a-building/","s":[["太阳光很好","晒着浓浓的茶水","我伸出手","在太阳下端详着","细细的掌纹","朋友们在谈论天气以及掌故","掌故是一个两百年前跳楼的美人","当然很多美人都喜欢跳楼古时候","就像现在的美人喜欢香水和矮个子男人","朋友们就从这里开始了故事","用了一些已不太流行的缠绵绯恻的词句","谈论那个美人的爱情故事","我一边看着掌纹的密密疏疏","一边揣测美人跳楼的凄美镜头","或许可以拍成一部伤感的爱情电影","让幸福的情侣在观众席上拥抱加哭泣","用四角五分钱享受一下","同时用可口可乐或酸奶润润喉咙","这时候朋友们已经讲完故事","开始回到跳楼的优美情节","我们用一种惋惜的目光","跟着他的手指","然后他停下来对着","那边摇摇欲坠的两层木板房","就在那块破的栏杆边","掉了下来","摔断了尾椎骨","据说是儿媳对她不好","当然她还是嫁了个人生了个儿子女儿什么的","难道有哪里不对","她年轻的时候可的确是个美人"],["—— 一九八九年"]],"m":""},{"t":"没有下雪的那个冬天","d":"—— 一九九〇年一月一日","g":null,"u":"/posts/the-winter-without-snow/","s":[["那个冬天","没有下雪","就像我们已经习惯了的那样","唯一不同的","是个女孩兴冲冲跑来说","她家的阳台上积了雪","当我明白她家的冰箱从不放到阳台上","以及商店里已经像人们习惯了的那样","不卖关于雪的画片","我才建议她最好到医院去挂个眼科号","但她那双大眼睛还是眨了眨","继续说她家的阳台上积了雪","据说她还尝了尝","不甜也不咸","只是像我们已经习惯的食品","有点过期的霉味","当然那还是雪　对不对","她抬起头继续问","我支吾着说那可能是吧","既然它不是白糖和盐巴"],["—— 一九九〇年一月一日"]],"m":""},{"t":"概率计算","d":"—— 一九九〇年","g":null,"u":"/posts/probability-calculation/","s":[["在我们所熟悉的城市中","每隔１２秒半","就有一个人","手里提着几颗大白菜","或者一束鲜花","也许是当天的报纸","上面说昨天有十辆车","压死了九个人","他正纳闷","于是他们的脚尖都不太经心地","走向一个或两个车轮子","在这种的确属于意外的情况下","他们的老婆忘了说他们的鲜花","或者类似的植物买得太贵和抱怨","今晚的电视过于乏味","而报贩们已经开始叫喊","最新消息","有十一辆车压死了十个人","当然","我们仍在纳闷","继续思索这个奇怪的问题……"],["—— 一九九〇年"]],"m":""},{"t":"怀念少女黄阿蒙","d":"—— 一九九〇年十月一日","g":null,"u":"/posts/remembering-girl-huang-ameng/","s":[["在拥有那些落雨纷飞的日子里","阿蒙总是和我打着一两把雨伞","到隔有两百多米的一个商店买","一点食物和要用的东西然后再","慢慢走回来阿蒙喜欢一点花花","绿绿的而我往往只买上一包烟","然后阿蒙便用她穿着雨靴的脚","把水花踩得到处都是阿蒙喜欢","蓝颜色的羽毛插在帽子大衣上","花瓶里阿蒙每天早上起来都说","她做了一个梦梦中的她变成了","一只长满蓝色羽毛的鸟飞得很","高很高只有我知道她从未做过","这样的梦"],["—— 一九九〇年十月一日"]],"m":""},{"t":"像藻类一样亲切和必需","d":"—— 一九九〇年十一月","g":null,"u":"/posts/intimate-and-necessary-like-algae/","s":[["鱼和爱情泅于243.6米的海底","按着既定的方向","向太阳伸展枝条","长着叶子的植物和裸露光洁皮肤的鱼人","在海底织网","打捞阳光和飞鸟","藻类安静地生长","带着岁月的倦意和信心","产生食物风景和爱情","这都是我们需要的东西","作为鱼人我们喜欢对情人说","你像藻类一样亲切和必需","鱼人们喜欢月光和沙滩","就像陆地人喜欢核导弹和太阳","我们长长的发飘于海中","像藻类一样亲切和必需"],["１９９０/１１"],["—— 一九九〇年十一月"]],"m":""},{"t":"爱情杀手","d":"—— 一九九〇年十二月三十日","g":null,"u":"/posts/love-killer/","s":[["可爱的她花枝招展名叫午夜皇后","夜夜埋伏猎物就在情人路","冰凉的狙击步枪便是她惟一的丈夫"],["本来这些事和我毫无关系","偏偏这是我管的区域","我跟踪她三天三夜","终于在她再次下手前捉住了她","她放下沉甸甸的狙击步枪","却换上了如花的笑容","这一刻我竟然成为她的俘虏","她笑笑就取走我手上的枪","再笑笑就扳动了手枪","惟一的意外是匣中空空无物"],["我闭上眼左手抽出枪","她张惶失措地忍住了一串弹头","洁白的衣衫上开了朵鲜艳的花","我轻轻把她抱在怀中","说我这辈子当你的丈夫好不好","她妩媚地笑着想了很久","终于点了点头"],["我辞了职搬到远远的山区","找了幢偏僻的小房子","我将她埋在屋后的花园","旁边放着那把黑黑的狙击步枪","这些年来","我惟一后悔的就是不该去当警察"],["每一个梦里她总是甜甜的笑着","依旧端起狙击步枪","把我打得粉身碎骨","然后娇笑着抱着我说","“你是我惟一的丈夫”"],["—— 一九九〇年十二月三十日"]],"m":""},{"t":"玻璃盒子","d":"—— 一九九一年","g":null,"u":"/posts/glass-box/","s":[["我们一眼就看出这是一个玻璃盒子","空空的玻璃盒子","尽管我们怀疑地听着那人说","这是一个不平常的玻璃盒子","我们还是买下了它","从此每一个夜晚我都得起床一次","看一看我们的玻璃盒子","树正在落叶月亮往东面走去","但玻璃盒子却一直都是老样子","甚至连一点新的灰尘都没有沾上","我就放心地回到床上去","之后不久你悄悄侧身","越过熟睡的我的梦境","走下床去看看玻璃盒子","可玻璃盒子总是老样子","一直整整齐齐放在屋的正中","放在仅有着一张桌子一张床的","我们之间"],["—— 一九九一年"]],"m":""},{"t":"乘客","d":"—— 一九九一年一月一日","g":null,"u":"/posts/the-passengers/","s":[["你一直坐在你来时的那个角落","自顾自望墙上单单的影子","一言不发像个受冷落的孩子","咖啡早就冷了过多的糖在勺上","慢慢渗出来愈觉得咖啡的苦涩","今年据说地球变暖了很多但你","摇摇头说没感觉到的确我也","未感觉到但毕竟是暖了很多吧","手上的纸烟早到头隐约灼到","你的手指你淡漠地看了看一动不动","秋天的雨就像这个季节的面包一样","你看了看钟说火车快开了但火车","究竟多久开到哪儿我们都不知道","但毕竟会有人知道的有人知道","它多久开到哪儿以及票价多少","但我们不知道但会有人知道会有","人关心难道你未曾觉得我们在","离开对面那列车吗我们感觉","到了而并不关心只有站台的人说","他们去了按照我们路线","但那是他们的事我们应该回家吃饭","毕竟明天还得上班"],["—— 一九九一年一月一日"]],"m":""},{"t":"瓷瓶","d":"—— 一九九二年","g":null,"u":"/posts/porcelain-vase/","s":[["我们就是早已失落的瓷瓶","却并未有他们想象的珍贵","我们已失落千年","与尘土为伍","在黑暗的砂粒之间格格不入","我们的外部已布满裂缝","我们终将碎去","我们的存在","已在史书中模棱两可","连同制造的人们","都叫做无法考证","也许明天","我们就会同尘土一样","毕竟我们和他们","具有相同的原子与构型","但在今天  作为瓷瓶","骄傲着我们身为瓷瓶","内部却空无一物"],["—— 一九九二年"]],"m":""},{"t":"树","d":"—— 一九九二年一月一日","g":null,"u":"/posts/tree/","s":[["我未曾料到有朝一日我会成为一棵树","和大多数同类一样","随遇而安","夜夜栖于自己的一双大脚","把秘密都收藏起来","对于艳阳和暴雨都守口如瓶","谨慎地张开手指握住光线和水份","没有人会明白","为什么我们就这样站着","一动不动","过着一生"],["—— 一九九二年一月一日"]],"m":""},{"t":"叶子","d":"—— 一九九二年","g":null,"u":"/posts/leaf/","s":[["多年来的某些习惯","跟在我的身后","生命的颜色辨认不清"],["从大城市最热闹的街头","摩天大楼的顶层直到地下室","纯洁的空气使它的翅膀","闪烁不定"],["总是在夜深人静的时候","我才会听到来自内部的声音","目光和过重的思想开始下降","我静静伫立着","它们落在我的四周"],["鸽子飞过的阴影中","浪迹天涯的孩子","他的衣衫飘零如风"],["是什么生长在我的周围","使我从未孤独却夜夜沧然涕下","在我伸出的手指上","时起时落"],["多年来的某些习惯","使我仍像当年那样","折朵花","含在唇间","不经意地跨过山林"],["—— 一九九二年"]],"m":""},{"t":"存在","d":"—— 一九九二年","g":null,"u":"/posts/existence/","s":[["我活在包围我的东西之外","那是只大大的螺壳","可以容纳我的一生","那里嘈杂 又脏又乱","但不知为什么我一在里面","就觉得舒舒坦坦"],["我的身体柔软而单薄","不堪轻轻一击","但它却结实","同时沉重"],["在林立的高楼大厦中","我扛着它进进出出","满头大汗"],["—— 一九九二年"]],"m":""},{"t":"成长","d":"—— 一九九二年","g":null,"u":"/posts/growth/","s":[["从小我就学习如何处理伤口","使用酒精 棉球以及双氧水","每天我的躯体总会有个位置","涂着碘酒 或被包扎","这是件与生俱来的习惯"],["学会如何处理伤口是件重要的事","我一边说","一边把玻璃渣从皮肤深处镊出","慢慢裹上油纱","至少 我已习惯玻璃的硬度","以及酒精的烧灼"],["隔着岁月 我细心地看着双手间","密密而细小的瘢痕","它们琐屑 无足轻重","而在那些年里","却是一场又一场的风暴"],["—— 一九九二年"]],"m":""},{"t":"失踪的河","d":"—— 一九九二年十一月六日","g":null,"u":"/posts/the-missing-river/","s":[["对面的红色路灯照着寒雨","我急急穿过一个冬天的冰凉大街","带着斧头的人正越过玻璃橱窗","没有留下任何痕迹","我在找着一个","使斧头受伤的人","他和我的一生纠缠不清","另一个城市","在断裂的眼睛和嘴角中","那个陌生的人活在","一片靠近海的沙地里","常常奔跑而过","后面跟着一只小鸟","而一切都已断裂","所有见过他的人都已死去","他正在失踪","在一个冬天的冰凉大街"],["—— 一九九二年十一月六日"]],"m":""},{"t":"一个陌生的小女孩","d":"—— 一九九三年","g":null,"u":"/posts/a-strange-little-girl/","s":[["没有回家的那个小女孩","她一个人沿着冰冷的大街","走向一个沿未决定的终点","她的眼黑得像郁金香","吸引着鸽群飞来飞去","道旁开着满眼的大丽菊","像散开的绒布围在她的周围"],["小女孩低着头","世界仅仅是她眼里的反光","她的茫然不知像是固守枝头的","几片树叶","秋雨之中格外夺目"],["什么时候她会从街上走过来","没有人知道","她自顾自走在笔直的路上","怀抱着一个尚未决定的开始"],["—— 一九九三年"]],"m":""},{"t":"有关于爱情和死亡（组诗）","d":"—— 一九九三年","g":null,"u":"/posts/about-love-and-death-poetry-series/","s":[["Ⅰ"],["像次小小的死亡","又似乎留下了什么","我就这样浮出水面","来到陌生的你面前"],["风卷着帘子","看不见的外面","世界正一点点毁灭","你靠在黑黑的门口","提着昏黑的油灯","我们相隔遥远","影子却在天花板上交错晃动"],["月上水面的时候","我坐在门口","太阳在屋后沉下去","我的脸在光中变幻不定","你在床边长久凝视着我","如同辨认远游回家的丈夫"],["Ⅱ"],["一个下午","慵懒的阳光","我坐在藤椅中","读着古人的书"],["他们早已死亡","但油墨未干","发出的清香使我疑惑","然后我做着梦","梦中栩栩如生的他们","站在以后耐心等着我"],["醒了以后夜已黑尽","倒挂着的残月","冷冷看着我"],["Ⅲ"],["梅花落尽","最后一朵飘浮如你的脸","疲惫地笑着","任凭风吹落"],["我伸出手","你的手指就在掌中剥落","一层又一层缓缓褪去"],["像一个苍白的影子","总是落在我的视线之后"],["从此","我的一生不再有你","半夜淡淡忧伤","伴着早醒的花和我"],["Ⅳ"],["我会和树林一起腐烂","那时花已开放","幼苗伸开小手迎接","春天又会再来","而对于我","一切将成为过去"],["生命是只过于苍惶的鸟","它的阴影在我的眼前一闪即过","而我","还未来得及看清它的形状"],["隔我很远的地方","是一片静寂的沉默之地","那是一个思考的好地方","而平时 我们的情感和思想","总是频频为语言所打扰"],["来到那里","我未说出的话","将和秋天的树叶一起剥落","使我们成为独立着的","那一枝枝树干","在黑夜之中","犹自闪闪发光"],["—— 一九九三年"]],"m":""},{"t":"每一个日子","d":"—— 一九九三年","g":null,"u":"/posts/every-day/","s":[["每一个日子","都是无法再续的歌","我们围坐在这年的冬天四周","如同松果围绕着松树","鱼儿包围着河水"],["每一个日子","如同花瓣","在我们的掌中层层剥落","我们停留在玻璃窗的外面","呵出的热气","使镜面变得模糊"],["每一个日子","都是前来告别的朋友","他共享过我的骄傲和卑俗","在他离去的时候","没有留下字条","却碰响了家门口的风铃"],["—— 一九九三年"]],"m":""},{"t":"诗歌","d":"—— 一九九三年一月","g":null,"u":"/posts/poetry/","s":[["每一首诗歌都来源于一个","小小的幻想","我们终日在巨大的地壳上行走","而裂缝总在夜间发生","成为明天","在窗前飞舞不去的蛾群"],["黎明的背后","快乐的日子","像一支箭","远远地离开了我们"],["年与年来","诗是时间的小小礼物","如同黄昏街头","有人唱起你喜爱的歌"],["—— 一九九三年一月"]],"m":""},{"t":"陌生人","d":"—— 一九九三年七月七日","g":null,"u":"/posts/stranger/","s":[["像件破衣裳飞舞而过","风中","一个陌生人走过我的生活","中午１２点半","我打着哈欠","看着公文","嘴角叼着一只香烟","还未来得及将烟灰弹掉","他穿着件黑色的罩袍","长发在风中凌乱不堪","在我那从未拭净的玻璃窗外","径直穿过马路","消失在人群中","这是个陌生的男子","中午１２点３２分","在我的视线内迅速消失"],["—— 一九九三年七月七日"]],"m":""},{"t":"异乡人","d":"—— 一九九三年七月七日","g":null,"u":"/posts/stranger/","s":[["每一个行走匆匆的异乡人","我看见了你忧郁的脸"],["车窗外冰冷的雾气后面","它们安静地蛰伏","冬天枝头上","一张张冰凉的叶片"],["但是","面无表情的它们还是","泄露了你的秘密"],["亲爱的异族兄弟","带着你们的羊皮大袄","和远方的笑容","一步步来到我们的城市","一步步","来到我们这些陌生人中","生长繁殖","像一棵被风吹远了的松果","开始发芽"],["—— 一九九三年七月七日"]],"m":""},{"t":"梅花","d":"—— 一九九三年十二月七日","g":null,"u":"/posts/plum-blossom/","s":[["花朵静静伫立在枝头","候鸟整齐 栖于季节的狭缝"],["暗香浮动","飘落是它缅怀的情节"],["梅花就这样","在黑夜的暗纱后","悄悄地想"],["—— 一九九三年十二月七日"]],"m":""},{"t":"雕花铁栏杆的阴影","d":"—— 一九九四年","g":null,"u":"/posts/shadow-of-the-carved-iron-railing/","s":[["你站在阳光的中央","雕花铁栏杆的阴影","投在你的身上","你说：","\"你给我带来了忧伤。\""],["一只蝴蝶","停在不远的枝上","这么多年来","我总是想不起","我们的生命中","曾有这样相似的地方"],["岁月总是","像个顽皮的孩子","用铅笔在透明的日子里","沙沙地写着","然后又用橡皮擦去","那些生命中令我","疼痛的痕迹"],["—— 一九九四年"]],"m":""},{"t":"围坐火炉","d":"—— 一九九四年","g":null,"u":"/posts/sitting-around-the-stove/","s":[["冬天又来了","我们又坐在火炉的四周","静静地看着火苗"],["外面下着雪","从中午直到黄昏","我们看到雪地里的玉米仓","独自向我们走近"],["我们像那两只","松树上的小东西","一点一点地","啃着坚硬的日子"],["这平静安闲由来已久","因为我们对于冬天","始终有着一种质朴的安居乐业"],["—— 一九九四年"]],"m":""},{"t":"一页翻开的书","d":"—— 一九九四年","g":null,"u":"/posts/an-opened-page-of-a-book/","s":[["一个秋天","或者更好的一个","适宜于想像的日子"],["一张翻开的纸","上面写着密密的","黑色的字"],["翻过一页纸","犹如揭开一层肌肤","从而深入内部"],["在那里有着血管流动","火车一样繁忙交通","密密织成的脉络"],["翻过一页纸","地下铁道里传来","一个城市的心跳"],["一条缓缓的河流","在一个黑黑的夜里","停留在昏黄的白炽灯光中"],["犹如蝴蝶","静静栖在我的书桌上","轻轻扇动着它的翅膀"],["—— 一九九四年"]],"m":""},{"t":"格林的房子","d":"—— 一九九四年","g":null,"u":"/posts/greens-house/","s":[["一个退休的老士兵","扛着一支火药枪","他的背后是一个大大的风车","不停的转呀转呀"],["有着一个老巫婆","有着一个美丽的公主","她们在遥远的未来","盼呀盼呀盼"],["老士兵走得太慢","风车吹也吹不动他","只好对他说："],["老士兵走快些","前面有人等着你"],["老士兵问它是谁在等他","风车说："],["老士兵走快些","有位公主等着你"],["老士兵说：我太老了","公主又太年轻","风车只好又说："],["老士兵走快些","有个巫婆等着你"],["老士兵说：","我打仗已太累了","请你问问老格林","能不能让我歇一歇"],["风车说：","老士兵呀老士兵","这可是不行","大家都在看着你","你可不能停"],["老士兵叹着气","就这样在路上走着","走着","慢慢地走着","直到我将书轻轻合上"],["—— 一九九四年"]],"m":""},{"t":"灯光下的旅行","d":"—— 一九九四年","g":null,"u":"/posts/journey-under-the-lights/","s":[["灯光下的一张白纸","像孩子对着太阳摊开的手掌","绿叶从指尖长出","每片叶子都有个长长的故事"],["灯光下的一张白纸","光线像海浪涌上沙滩","又褪去","我走在洁白的沙之上","脚印在交接之处忽隐忽现"],["灯光下的一张白纸","是一个空白的故事","还是一个空白的日子","我们用手将它们","小心翼翼地收藏起来"],["—— 一九九四年"]],"m":""},{"t":"野菊花地","d":"—— 一九九四年","g":null,"u":"/posts/wild-chrysanthemum-field/","s":[["菊花和它们的花朵安静地呆在一起","这儿隔城市很远","使它们平心静气专心于生长和开放","一年接着一年"],["春天它们发芽","夏天它们开花","秋天它们播种","冬天它们休止"],["它们总是这样开着花","金黄色的花朵单调而热烈","无论我们对它使用剪刀","或是浇灌清水","它们永远都带着花朵的清香和纯洁"],["或者我们将它们插入瓶中","或在市场上兜售","它们都带着淡淡的微笑","永远拒绝任何形式的表现","固执地存在"],["—— 一九九四年"]],"m":""},{"t":"与书有关的诗","d":"—— 一九九四年八月十一日","g":null,"u":"/posts/a-poem-about-books/","s":[["在那有些泛黄的叶片后面","究竟隐藏了些什么","越来越暗淡下来的日光下面","我读着你写下的","每一片薄薄的雪花","时光的手指一页页地翻过","我们那本匆匆的故事","怎么经得起","这一遍又一遍的检阅和注视","总是到了这样的最后","直到每盏灯光下飞舞的蛾群","都疲倦地睡去","那些苍白而脆弱的翅膀","才在我的掌上悄悄合拢","这样的夜色之中","那唱得最动情的歌","到了末了","也总是有不得不收藏起来的时候"],["—— 一九九四年八月十一日"]],"m":""},{"t":"窗帘","d":"—— 一九九五年","g":null,"u":"/posts/curtain/","s":[["风掀动我那厚实的窗帘"],["无意中揭开了体内的一层纱布"],["我感觉到了那种轻轻撕裂的疼痛"],["那是纱布和已经成形的血痂分离的过程"],["气温很高"],["窗帘的背后阴冷潮湿不宜久居"],["摊开的那页书"],["是我整个冰山的一个小尖"],["每日的奔波劳作都挤在那个小小的尖角"],["它们和我挤在一起"],["那是阳光和我的眼睛"],["可以监视的地方"],["在窗帘后面"],["那儿四壁都是我的兄弟"],["我们有着相同的血缘"],["和相似的苍白面孔"],["每一寸开始驳落的裂纹"],["都是我身上长久以来的伤口"],["它平时习惯于沉默"],["这一点和我一样"],["但在风雨来临的前夕"],["就会疼痛不已"],["任何药物对它来说都会失去作用"],["这种疼痛代表着一种生存的方式"],["而不是一种结果"],["—— 一九九五年"]],"m":""},{"t":"蚂蚁","d":"—— 一九九五年","g":null,"u":"/posts/ant/","s":[["我的手有点发僵","城市的肺部炎症加重","明天是一张冰凉的玻璃窗"],["下一支渡船就在那边","今天总是太过匆忙","过去是一张愈来愈密的网"],["我们活着","或者说","今天我们还在"],["就是这样的结构","或方块汉字","也许一个站满了人的广场","说出了我嘴里的全部含义"],["只是我的手还是冷得发僵","这是一种现实","说明这一切的想法","都是在一个冬天的早上完成"],["而我做的下一件事","连我自己也不知道"],["—— 一九九五年"]],"m":""},{"t":"空降部队","d":"—— 一九九五年一月十日","g":null,"u":"/posts/airborne-troops/","s":[["（献给死去的法国空降士兵和那些勇于在绝望中生存的战士）","弹片和泥泞生长在你们的身体之上","像一堆又一堆渐渐蓬松的胡须","我们生活在一个遥远的国度","明天是一只想从窗口飞出的苍蝇","我们日复一日","明天总是太近","下一次的冲锋还远","我们远离了故乡和情人","来自高高的天空","而一切总是这样的平静","只有死神和我们比邻而居","我们总是静静等待着","他的敲门声响起","我们像一支支的蚂蚁","生存着","从葡萄酒到香榭里娜大街","这儿的机枪弹壳"],["—— 一九九五年一月十日"]],"m":""},{"t":"诗歌的想法","d":"—— 一九九五年二月","g":null,"u":"/posts/thoughts-on-poetry/","s":[["我们多多少少地活着","与世人比邻而居","每天早上从一个句子里醒来","就看到了新的一天","这是多好的一个词语","使我们终日浮想连翩"],["一粒石子","就能使我和这个世界决裂","但是","一朵鲜花","也可能使我和这世界握手言和"],["这是一件细微的事情","如同我的牙齿里","咀嚼过的词语"],["—— 一九九五年二月"]],"m":""},{"t":"站在春天里的女子","d":"—— 一九九五年三月六日","g":null,"u":"/posts/woman-standing-in-spring/","s":[["夜鸢悄悄掠过了我们的头顶","一种黑暗的光线","在心河深处涉水而过","我们的瞳孔对之无知无觉"],["四月是一个眸子黑黑的女子","城外的花开得正好","她的裙是滚花金边"],["她在黑夜走过了那两棵高大的玉兰树","玉兰花便在她的背后落了下来"],["四月是一个风华正茂的女子","连规规矩矩的小步","也会带起一阵阵的轻风"],["她总是在暗地里才想起","她是一个短短的四月","她站在越来越短的春天里","舍不得离去"],["—— 一九九五年三月六日"]],"m":""},{"t":"死亡","d":"—— 一九九五年四月七日","g":null,"u":"/posts/death/","s":[["在伸手触及的 ,"两个正破口大骂的妇人"],["拥挤的人拥挤的城市拥挤的电梯","荷枪实弹的土兵只为拥挤的钞票","保驾护航","出租车又在罢工","街上走满","饥肠辘辘的匆忙上班人"],["—— 二〇〇一年二月五日"]],"m":""},{"t":"我看见","d":"—— 二〇〇一年四月八日","g":null,"u":"/posts/i-see/","s":[["在窗台上","我看见阳光","把土瓶中的菊花","一片片皮肤剥开"],["更远的地方","透过树叶的摇动","我看见了风","它让残墙内开满鲜花"],["在海的表面","我看见了鱼的尸体","它们在夜的边缘浮现白光","让月亮黯然失色"],["在夜的背后","我看见","一只透明的鸟飞过","在它下面","那没有人的旷野","人们围着火堆跳舞"],["在玻璃的另一边","我看见","很多晶莹透明的骨头","在围着燃烧的骨头跳舞","我还看见","那些被遗忘的记忆","它们穿过了更远的人群而来"],["—— 二〇〇一年四月八日"]],"m":""},{"t":"夏天,比溺水的女人更平静","d":"—— 二〇〇一年五月二十三日","g":null,"u":"/posts/summer-calmer-than-a-drowning-woman/","s":[["夏天是一阵又一阵的盛开的阳光","比海浪更狂","比溺水的女人更平静"],["夏天","把花变成一种想象","把海风从房屋的另一面","吹进来","把唇边有着咸味的你","带来到了我们中间"],["夏天","把透明的梦境之门在你的身后打开","里面有着螺旋的石梯","向上"],["夏天,背对我们的扑克牌","正一张张打开","这是夏天","一切才刚刚开始"],["—— 二〇〇一年五月二十三日"]],"m":""},{"t":"写给非洲死难的儿童","d":"—— 二〇〇一年八月十四日","g":null,"u":"/posts/for-the-children-who-died-in-africa/","s":[["夜徘徊在白天的边缘","远处有人在梦中锯断森林","饥饿的孩子们","赤足走向更荒凉的沙漠"],["被砍断的双腿","多过了疾病带来的苦痛","被砍伐的城市","超过了地震与火山的力量"],["埋葬、射杀和报复","谁都能比谁伤害得更深","不同肤色的上帝和仇恨","我们离未来越来越远"],["—— 二〇〇一年八月十四日"]],"m":""},{"t":"一个冬天正在来临","d":"—— 二〇〇一年十月十五日","g":null,"u":"/posts/a-winter-is-coming/","s":[["一个冬天正在来临","另一个冬天正在死去","雨夜行人积水的街道"],["突然来临的刺眼车灯","照亮了我的双眼","在刹那而永久的漆黑中","我们终于找到了自己"],["—— 二〇〇一年十月十五日"]],"m":""},{"t":"早上雨中","d":"—— 二〇〇一年十月十八日","g":null,"u":"/posts/morning-rain/","s":[["用两张塑料布","在风雨之中搭个窝","卖报的老头缩在角落","把报纸尽量铺开","各报的头版用着重重的大标题","……美国染瘟疫","……有人生了三胞胎","卖报的老头漠然地看着报纸","显然新闻和他没有多少关系"],["—— 二〇〇一年十月十八日"]],"m":""}] };</script></main>
