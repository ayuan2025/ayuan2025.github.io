    <h1>一把空空的椅子</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>一把空空的椅子</span><span>清晨的光透过它</span><span>静静投在下面的草地</span><span>许多的人抚摸过它</span><span>它的边缘还闪着圆润的光</span><span>现在它已被遗弃</span><span>在这一片荒地</span><span>撕裂的油漆</span><span>是它早已失去了疼痛的皮肤</span><span>在椅子里面</span><span>还藏着整个森林的记忆</span><span>那在潮湿的水洼边缘的一生</span></p>
<p class="stanza"><span>—— 二〇〇一年二月五日</span></p></div>
