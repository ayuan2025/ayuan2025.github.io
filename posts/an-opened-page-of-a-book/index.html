    <p class="post-meta">—— 一九九四年</p>
    <h1>一页翻开的书</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>一个秋天</span><span>或者更好的一个</span><span>适宜于想像的日子</span></p>
<p class="stanza"><span>一张翻开的纸</span><span>上面写着密密的</span><span>黑色的字</span></p>
<p class="stanza"><span>翻过一页纸</span><span>犹如揭开一层肌肤</span><span>从而深入内部</span></p>
<p class="stanza"><span>在那里有着血管流动</span><span>火车一样繁忙交通</span><span>密密织成的脉络</span></p>
<p class="stanza"><span>翻过一页纸</span><span>地下铁道里传来</span><span>一个城市的心跳</span></p>
<p class="stanza"><span>一条缓缓的河流</span><span>在一个黑黑的夜里</span><span>停留在昏黄的白炽灯光中</span></p>
<p class="stanza"><span>犹如蝴蝶</span><span>静静栖在我的书桌上</span><span>轻轻扇动着它的翅膀</span></p>
<p class="stanza"><span>—— 一九九四年</span></p></div>
