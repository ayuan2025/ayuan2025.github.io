  </header>
  <div class="post-body"><p class="stanza"><span>你来过</span><span>这个下午</span><span>雪后来下过</span><span>盖过了你来时的脚印</span><span>雪后来下过</span><span>盖过了你走时的脚印</span><span>后来</span><span>电话响过</span><span>后来</span><span>雨也下过</span><span>后来</span><span>一直没有发生什么</span></p></div>
