    <h1>异乡人</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>每一个行走匆匆的异乡人</span><span>我看见了你忧郁的脸</span></p>
<p class="stanza"><span>车窗外冰冷的雾气后面</span><span>它们安静地蛰伏</span><span>冬天枝头上</span><span>一张张冰凉的叶片</span></p>
<p class="stanza"><span>但是</span><span>面无表情的它们还是</span><span>泄露了你的秘密</span></p>
<p class="stanza"><span>亲爱的异族兄弟</span><span>带着你们的羊皮大袄</span><span>和远方的笑容</span><span>一步步来到我们的城市</span><span>一步步</span><span>来到我们这些陌生人中</span><span>生长繁殖</span><span>像一棵被风吹远了的松果</span><span>开始发芽</span></p>
<p class="stanza"><span>—— 一九九三年七月七日</span></p></div>
