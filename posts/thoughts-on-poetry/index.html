  <header class="post-head">
    <p class="post-meta">—— 一九九五年二月</p>
    <h1>诗歌的想法</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我们多多少少地活着</span><span>与世人比邻而居</span><span>每天早上从一个句子里醒来</span><span>就看到了新的一天</span><span>这是多好的一个词语</span><span>使我们终日浮想连翩</span></p>
<p class="stanza"><span>一粒石子</span><span>就能使我和这个世界决裂</span><span>但是</span><span>一朵鲜花</span><span>也可能使我和这世界握手言和</span></p>
<p class="stanza"><span>这是一件细微的事情</span><span>如同我的牙齿里</span><span>咀嚼过的词语</span></p></div>
