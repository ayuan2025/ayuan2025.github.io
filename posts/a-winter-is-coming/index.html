    <h1>一个冬天正在来临</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>一个冬天正在来临</span><span>另一个冬天正在死去</span><span>雨夜行人积水的街道</span></p>
<p class="stanza"><span>突然来临的刺眼车灯</span><span>照亮了我的双眼</span><span>在刹那而永久的漆黑中</span><span>我们终于找到了自己</span></p></div>
