  <header class="post-head">
    <p class="post-meta">—— 一九八九年</p>
    <h1>剑客</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>一个爱花的人</span><span>并且认定世界上只有一种花</span><span>是要用全部生命</span><span>在刹那开放的那朵</span></p>
<p class="stanza"><span>有很多美丽的头颅</span><span>和鲜艳的双眼</span><span>但有人热爱凝视而且一定只看一个地方</span><span>秋后那儿发芽</span><span>他们站在风中</span><span>学会热爱鲜花</span><span>以一种落叶的方式</span></p>
<p class="stanza"><span>—— 一九八九年</span></p></div>
