    <p class="post-meta">—— 一九九五年</p>
    <h1>蚂蚁</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我的手有点发僵</span><span>城市的肺部炎症加重</span><span>明天是一张冰凉的玻璃窗</span></p>
<p class="stanza"><span>下一支渡船就在那边</span><span>今天总是太过匆忙</span><span>过去是一张愈来愈密的网</span></p>
<p class="stanza"><span>我们活着</span><span>或者说</span><span>今天我们还在</span></p>
<p class="stanza"><span>就是这样的结构</span><span>或方块汉字</span><span>也许一个站满了人的广场</span><span>说出了我嘴里的全部含义</span></p>
<p class="stanza"><span>只是我的手还是冷得发僵</span><span>这是一种现实</span><span>说明这一切的想法</span><span>都是在一个冬天的早上完成</span></p>
<p class="stanza"><span>而我做的下一件事</span><span>连我自己也不知道</span></p>
<p class="stanza"><span>—— 一九九五年</span></p></div>
