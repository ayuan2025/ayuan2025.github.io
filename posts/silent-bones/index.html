    <h1>寂静的骨头</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>冻着的泥土下面</span><span>曾经有着什么</span><span>这个念头让我有趣</span><span>我用铁揪掀开表皮</span><span>找出一块冰冷的骨头</span><span>它曾在很多年前</span><span>跟着它的主人走过高高的山岭</span><span>现在，它安静地躺着</span><span>像一只光秃秃的花蕊</span><span>离开了枝干和叶片</span><span>我也远离了人群</span><span>隔我最近的</span><span>就是天上的星星</span></p>
<p class="stanza"><span>—— 一九九九年三月十日</span></p></div>
