    <p class="post-meta">—— 一九九四年</p>
    <h1>灯光下的旅行</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>灯光下的一张白纸</span><span>像孩子对着太阳摊开的手掌</span><span>绿叶从指尖长出</span><span>每片叶子都有个长长的故事</span></p>
<p class="stanza"><span>灯光下的一张白纸</span><span>光线像海浪涌上沙滩</span><span>又褪去</span><span>我走在洁白的沙之上</span><span>脚印在交接之处忽隐忽现</span></p>
<p class="stanza"><span>灯光下的一张白纸</span><span>是一个空白的故事</span><span>还是一个空白的日子</span><span>我们用手将它们</span><span>小心翼翼地收藏起来</span></p></div>
