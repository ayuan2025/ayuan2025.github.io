  </header>
  <div class="post-body"><p class="stanza"><span>我们在冬天开始了孤独</span><span>用诗把自己的伤口重重包裹</span><span>岁月总会给我们一对坚强的翅膀</span></p>
<p class="stanza"><span>载着沉重的躯壳</span><span>在空中舞蹈</span></p>
<p class="stanza"><span>离开城市就有我的花园</span><span>花朵笑的时候</span><span>人类还在哭泣</span></p>
<p class="stanza"><span>—— 一九九八年一月</span></p></div>
