    <p class="post-meta">—— 一九九二年</p>
    <h1>存在</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我活在包围我的东西之外</span><span>那是只大大的螺壳</span><span>可以容纳我的一生</span><span>那里嘈杂 又脏又乱</span><span>但不知为什么我一在里面</span><span>就觉得舒舒坦坦</span></p>
<p class="stanza"><span>我的身体柔软而单薄</span><span>不堪轻轻一击</span><span>但它却结实</span><span>同时沉重</span></p>
<p class="stanza"><span>在林立的高楼大厦中</span><span>我扛着它进进出出</span><span>满头大汗</span></p>
<p class="stanza"><span>—— 一九九二年</span></p></div>
