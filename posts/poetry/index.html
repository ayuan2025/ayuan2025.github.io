<article class="post poem-post">
  <header class="post-head">
    <p class="post-meta">—— 一九九三年一月</p>
    <h1>诗歌</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>每一首诗歌都来源于一个</span><span>小小的幻想</span><span>我们终日在巨大的地壳上行走</span><span>而裂缝总在夜间发生</span><span>成为明天</span><span>在窗前飞舞不去的蛾群</span></p>
<p class="stanza"><span>黎明的背后</span><span>快乐的日子</span><span>像一支箭</span><span>远远地离开了我们</span></p>
<p class="stanza"><span>年与年来</span><span>诗是时间的小小礼物</span><span>如同黄昏街头</span><span>有人唱起你喜爱的歌</span></p></div>
