    <p class="post-meta">—— 一九九四年</p>
    <h1>雕花铁栏杆的阴影</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>你站在阳光的中央</span><span>雕花铁栏杆的阴影</span><span>投在你的身上</span><span>你说：</span><span>&quot;你给我带来了忧伤。&quot;</span></p>
<p class="stanza"><span>一只蝴蝶</span><span>停在不远的枝上</span><span>这么多年来</span><span>我总是想不起</span><span>我们的生命中</span><span>曾有这样相似的地方</span></p>
<p class="stanza"><span>岁月总是</span><span>像个顽皮的孩子</span><span>用铅笔在透明的日子里</span><span>沙沙地写着</span><span>然后又用橡皮擦去</span><span>那些生命中令我</span><span>疼痛的痕迹</span></p>
<p class="stanza"><span>—— 一九九四年</span></p></div>
