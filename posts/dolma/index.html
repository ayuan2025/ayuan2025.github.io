    <p class="post-meta">—— 一九九六年五月十一日</p>
    <h1>卓玛</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我听见你的声音</span><span>在风中舞蹈</span><span>翅膀下面的手</span><span>掀动我紧闭的窗帘</span></p>
<p class="stanza"><span>手捧心脏的人</span><span>走过大地的裂缝</span><span>惊动的马群</span><span>从我身上狂奔而过</span></p>
<p class="stanza"><span>黑眼睛的孩子</span><span>伫立在黑色的崖边</span></p>
<p class="stanza"><span>你用歌声</span><span>将双手点燃</span><span>将风点燃</span></p>
<p class="stanza"><span>让我在风中飞舞</span><span>宛如蛾群</span><span>奔向</span><span>炽热的火炬</span></p>
<p class="stanza"><span>—— 一九九六年五月十一日</span></p></div>
