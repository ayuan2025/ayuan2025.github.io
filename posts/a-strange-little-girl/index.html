  <header class="post-head">
    <p class="post-meta">—— 一九九三年</p>
    <h1>一个陌生的小女孩</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>没有回家的那个小女孩</span><span>她一个人沿着冰冷的大街</span><span>走向一个沿未决定的终点</span><span>她的眼黑得像郁金香</span><span>吸引着鸽群飞来飞去</span><span>道旁开着满眼的大丽菊</span><span>像散开的绒布围在她的周围</span></p>
<p class="stanza"><span>小女孩低着头</span><span>世界仅仅是她眼里的反光</span><span>她的茫然不知像是固守枝头的</span><span>几片树叶</span><span>秋雨之中格外夺目</span></p>
<p class="stanza"><span>什么时候她会从街上走过来</span><span>没有人知道</span><span>她自顾自走在笔直的路上</span><span>怀抱着一个尚未决定的开始</span></p></div>
