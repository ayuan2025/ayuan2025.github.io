    <h1>夜冻如冰</h1>
    <div class="tags"><span class="tag">冬</span><span class="tag">孤独</span><span class="tag">黑色玫瑰</span><span class="tag">寒冷</span></div>
  </header>
  <div class="post-body"><p class="stanza"><span>夜冻如冰</span><span>红红的汽车尾灯</span><span>刺痛了我的眼</span><span>你在远远的树林那边</span><span>转身回望的眸子里</span><span>幽深晦暗</span><span>黑色的玫瑰在里面生长</span><span>闪亮着磷光</span></p>
<p class="stanza"><span>夜流走的日子里</span><span>我就这样站在窗前</span><span>数着落梅</span></p>
<p class="stanza"><span>夜就这样走了</span><span>冬天就这样走了</span><span>我却还站在那儿</span></p>
<p class="stanza"><span>—— 一九九七年十一月十四日</span></p></div>
