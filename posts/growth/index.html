    <p class="post-meta">—— 一九九二年</p>
    <h1>成长</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>从小我就学习如何处理伤口</span><span>使用酒精 棉球以及双氧水</span><span>每天我的躯体总会有个位置</span><span>涂着碘酒 或被包扎</span><span>这是件与生俱来的习惯</span></p>
<p class="stanza"><span>学会如何处理伤口是件重要的事</span><span>我一边说</span><span>一边把玻璃渣从皮肤深处镊出</span><span>慢慢裹上油纱</span><span>至少 我已习惯玻璃的硬度</span><span>以及酒精的烧灼</span></p>
<p class="stanza"><span>隔着岁月 我细心地看着双手间</span><span>密密而细小的瘢痕</span><span>它们琐屑 无足轻重</span><span>而在那些年里</span><span>却是一场又一场的风暴</span></p>
<p class="stanza"><span>—— 一九九二年</span></p></div>
