    <p class="post-meta">—— 一九九三年十二月七日</p>
    <h1>梅花</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>花朵静静伫立在枝头</span><span>候鸟整齐 栖于季节的狭缝</span></p>
<p class="stanza"><span>暗香浮动</span><span>飘落是它缅怀的情节</span></p>
<p class="stanza"><span>梅花就这样</span><span>在黑夜的暗纱后</span><span>悄悄地想</span></p>
<p class="stanza"><span>—— 一九九三年十二月七日</span></p></div>
