    <p class="post-meta">—— 一九九七年七月八日</p>
    <h1>影子</h1>
    <div class="tags"><span class="tag">自我</span><span class="tag">誓言</span><span class="tag">满月</span><span class="tag">回响</span></div>
  </header>
  <div class="post-body"><p class="stanza"><span>在一个梦中醒来</span><span>我找不到自己的脚步</span><span>我问那站在我背后的人</span><span>多年来他一直跟在我的背后</span><span>有没有拾到了我在过去</span><span>斩钉截铁许下的誓言</span></p>
<p class="stanza"><span>那是一个年少的黄昏</span><span>我离开了自己的家门</span><span>高梁地遮过了头顶</span><span>我对着</span><span>挂在未熄的天空之上</span><span>的月亮</span><span>说出我一生的愿望</span></p>
<p class="stanza"><span>他沉默着</span><span>和他从前一样</span><span>但我知道他一定隐藏了什么</span><span>因为我看着今夜</span><span>圆润无憾的满月</span><span>噙着泪光</span><span>却再无法知道说过了什么</span></p>
<p class="stanza"><span>而当时</span><span>我想自己一辈子也不会忘记</span></p>
<p class="stanza"><span>—— 一九九七年七月八日</span></p></div>
