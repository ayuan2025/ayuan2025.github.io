    <h1>概率计算</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>在我们所熟悉的城市中</span><span>每隔１２秒半</span><span>就有一个人</span><span>手里提着几颗大白菜</span><span>或者一束鲜花</span><span>也许是当天的报纸</span><span>上面说昨天有十辆车</span><span>压死了九个人</span><span>他正纳闷</span><span>于是他们的脚尖都不太经心地</span><span>走向一个或两个车轮子</span><span>在这种的确属于意外的情况下</span><span>他们的老婆忘了说他们的鲜花</span><span>或者类似的植物买得太贵和抱怨</span><span>今晚的电视过于乏味</span><span>而报贩们已经开始叫喊</span><span>最新消息</span><span>有十一辆车压死了十个人</span><span>当然</span><span>我们仍在纳闷</span><span>继续思索这个奇怪的问题……</span></p>
<p class="stanza"><span>—— 一九九〇年</span></p></div>
