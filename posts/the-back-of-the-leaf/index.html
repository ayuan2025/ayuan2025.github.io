    <h1>树叶的背面</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>谁在每片树叶的背后</span><span>写上句子</span><span>嘴唇含着它</span><span>就能吹出</span><span>失去的歌声</span></p>
<p class="stanza"><span>静立于暗夜</span><span>衣裾猎猎作响</span><span>无法怀念</span><span>只有风中</span><span>传来你指尖</span><span>叮咚的声音</span></p>
<p class="stanza"><span>岁月</span><span>只能记在纸上</span><span>“每一片树叶</span><span>都曾经给过我们</span><span>一个有歌的日子”</span></p>
<p class="stanza"><span>—— 一九九六年</span></p></div>
