    <p class="post-meta">—— 一九八九年</p>
    <h1>舞池</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>学会凝视</span><span>在歌手落寞的句与句之间</span><span>旋转于自己的裙边的 少女们</span><span>叶子般的旋转着</span><span>在她们所崇拜的情节</span><span>和秋风一样走远的歌词里</span><span>热衷凝视</span><span>掌中鱼样游着的光线</span><span>水不疾不缓</span><span>在手心稀疏河道中</span><span>开始舒展她们</span><span>掌纹一样美丽的</span><span>面庞和生命</span></p>
<p class="stanza"><span>—— 一九八九年</span></p></div>
