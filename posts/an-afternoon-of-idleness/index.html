    <h1>无所事事的下午</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>无所事事的下午</span><span>我站在十三楼高的阳台向外看着</span><span>这是冷冷的冬天,没有阳光</span></p>
<p class="stanza"><span>空气中的雾气发粘</span><span>我的咽喉有些异样的痛</span><span>所有的症状都说明冬天还长</span></p>
<p class="stanza"><span>天空像隔着一张塑料薄膜</span><span>我们的城市</span><span>围墙内堆积着垃圾</span><span>围墙外开着一家又一家美容店</span><span>小姐们坐在里面无所事事</span><span>五点三十分</span><span>一路欢笑的学生像水流过街口</span></p>
<p class="stanza"><span>天会渐渐黑透</span><span>屋内的音乐声越听越觉得遥远</span><span>夜晚的城市将灯火通明</span><span>只有不易察觉的星星</span><span>在天边悄悄地闪烁</span></p>
<p class="stanza"><span>—— 二〇〇一年</span></p></div>
