<article class="post poem-post">
  <header class="post-head">
    <p class="post-meta">—— 一九九七年七月八日</p>
    <h1>歌唱</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>美丽的鸟儿</span><span>我用琴弦带你到远方歌唱</span></p>
<p class="stanza"><span>我和你</span><span>一起穿过火车和城市</span><span>在陌生人群中间</span><span>唱大家熟悉的歌</span></p>
<p class="stanza"><span>不知不觉来到夜晚</span><span>树木围着篝火跳舞</span></p>
<p class="stanza"><span>鸟儿对微醉的我说</span><span>——离开吧</span><span>趁世界还在醉的时候</span></p>
<p class="stanza"><span>离开我们又熟悉的人们</span><span>到陌生的地方</span><span>在陌生人中间</span><span>唱大家熟悉的歌</span></p>
<p class="stanza"><span>——或者歌唱</span><span>或者死亡</span></p></div>
