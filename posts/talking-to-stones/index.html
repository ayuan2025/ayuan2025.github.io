    <h1>和石头谈话</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>花朵啊花朵</span><span>你开满了大草地</span></p>
<p class="stanza"><span>风啊风</span><span>风吹着脸让我感动</span></p>
<p class="stanza"><span>雪啊雪</span><span>盖掉我所有的足迹</span></p>
<p class="stanza"><span>你啊你</span><span>看不到这世界的肮脏和美丽</span></p>
<p class="stanza"><span>如果你仍无动于衷</span><span>我要用一块比你更坚硬的石头</span><span>来打动你</span></p>
<p class="stanza"><span>1999.1.8</span></p>
<p class="stanza"><span>—— 一九九九年一月八日</span></p></div>
