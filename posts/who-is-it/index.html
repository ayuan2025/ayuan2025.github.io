    <p class="post-meta">—— 一九九六年九月十六日</p>
    <h1>是谁</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>是谁在黑夜里吻我</span><span>令我不知所措</span></p>
<p class="stanza"><span>是谁</span><span>熄掉了所有的灯</span><span>让满天星光</span><span>刺痛了我的眼</span></p>
<p class="stanza"><span>是谁</span><span>教会我在暗夜里飞翔</span><span>一只风筝</span><span>远离了城市和人群</span></p>
<p class="stanza"><span>是谁</span><span>给了我温柔的水</span><span>洗去我早已坚硬的血痂</span><span>我曾瘸着腿</span><span>走过了所有的河流</span></p>
<p class="stanza"><span>是谁</span><span>和我在路灯下哭泣</span><span>我所拥有的</span><span>时间无法令它失去</span></p>
<p class="stanza"><span>是谁</span><span>从暗处走过</span><span>唱着我所熟悉的歌</span><span>像一件透明的衣裳</span><span>包裹住了</span><span>我所有忧郁的心情</span></p>
<p class="stanza"><span>—— 一九九六年九月十六日</span></p></div>
