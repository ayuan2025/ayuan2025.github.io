    <h1>失踪的河</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>对面的红色路灯照着寒雨</span><span>我急急穿过一个冬天的冰凉大街</span><span>带着斧头的人正越过玻璃橱窗</span><span>没有留下任何痕迹</span><span>我在找着一个</span><span>使斧头受伤的人</span><span>他和我的一生纠缠不清</span><span>另一个城市</span><span>在断裂的眼睛和嘴角中</span><span>那个陌生的人活在</span><span>一片靠近海的沙地里</span><span>常常奔跑而过</span><span>后面跟着一只小鸟</span><span>而一切都已断裂</span><span>所有见过他的人都已死去</span><span>他正在失踪</span><span>在一个冬天的冰凉大街</span></p>
<p class="stanza"><span>—— 一九九二年十一月六日</span></p></div>
