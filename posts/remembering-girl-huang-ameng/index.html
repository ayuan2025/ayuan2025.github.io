    <p class="post-meta">—— 一九九〇年十月一日</p>
    <h1>怀念少女黄阿蒙</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>在拥有那些落雨纷飞的日子里</span><span>阿蒙总是和我打着一两把雨伞</span><span>到隔有两百多米的一个商店买</span><span>一点食物和要用的东西然后再</span><span>慢慢走回来阿蒙喜欢一点花花</span><span>绿绿的而我往往只买上一包烟</span><span>然后阿蒙便用她穿着雨靴的脚</span><span>把水花踩得到处都是阿蒙喜欢</span><span>蓝颜色的羽毛插在帽子大衣上</span><span>花瓶里阿蒙每天早上起来都说</span><span>她做了一个梦梦中的她变成了</span><span>一只长满蓝色羽毛的鸟飞得很</span><span>高很高只有我知道她从未做过</span><span>这样的梦</span></p></div>
