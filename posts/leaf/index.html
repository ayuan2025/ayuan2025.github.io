    <p class="post-meta">—— 一九九二年</p>
    <h1>叶子</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>多年来的某些习惯</span><span>跟在我的身后</span><span>生命的颜色辨认不清</span></p>
<p class="stanza"><span>从大城市最热闹的街头</span><span>摩天大楼的顶层直到地下室</span><span>纯洁的空气使它的翅膀</span><span>闪烁不定</span></p>
<p class="stanza"><span>总是在夜深人静的时候</span><span>我才会听到来自内部的声音</span><span>目光和过重的思想开始下降</span><span>我静静伫立着</span><span>它们落在我的四周</span></p>
<p class="stanza"><span>鸽子飞过的阴影中</span><span>浪迹天涯的孩子</span><span>他的衣衫飘零如风</span></p>
<p class="stanza"><span>是什么生长在我的周围</span><span>使我从未孤独却夜夜沧然涕下</span><span>在我伸出的手指上</span><span>时起时落</span></p>
<p class="stanza"><span>多年来的某些习惯</span><span>使我仍像当年那样</span><span>折朵花</span><span>含在唇间</span><span>不经意地跨过山林</span></p>
<p class="stanza"><span>—— 一九九二年</span></p></div>
