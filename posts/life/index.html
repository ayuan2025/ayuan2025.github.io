    <p class="post-meta">—— 一九九九年十二月</p>
    <h1>生活</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>你把破碎的生活</span><span>照成了一张照片</span><span>你说</span><span>那就是生活</span></p>
<p class="stanza"><span>然后你把照片</span><span>撕成了无数碎片</span><span>你说</span><span>这就是生活</span></p>
<p class="stanza"><span>你让我知道</span><span>生活——</span><span>那鲜艳的正面</span><span>和苍白的背面</span></p>
<p class="stanza"><span>—— 一九九九年十二月</span></p></div>
