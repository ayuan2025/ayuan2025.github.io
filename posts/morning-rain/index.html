    <h1>早上雨中</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>用两张塑料布</span><span>在风雨之中搭个窝</span><span>卖报的老头缩在角落</span><span>把报纸尽量铺开</span><span>各报的头版用着重重的大标题</span><span>……美国染瘟疫</span><span>……有人生了三胞胎</span><span>卖报的老头漠然地看着报纸</span><span>显然新闻和他没有多少关系</span></p></div>
