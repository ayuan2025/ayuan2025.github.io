  <header class="post-head">
    <p class="post-meta">—— 一九九一年</p>
    <h1>玻璃盒子</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我们一眼就看出这是一个玻璃盒子</span><span>空空的玻璃盒子</span><span>尽管我们怀疑地听着那人说</span><span>这是一个不平常的玻璃盒子</span><span>我们还是买下了它</span><span>从此每一个夜晚我都得起床一次</span><span>看一看我们的玻璃盒子</span><span>树正在落叶月亮往东面走去</span><span>但玻璃盒子却一直都是老样子</span><span>甚至连一点新的灰尘都没有沾上</span><span>我就放心地回到床上去</span><span>之后不久你悄悄侧身</span><span>越过熟睡的我的梦境</span><span>走下床去看看玻璃盒子</span><span>可玻璃盒子总是老样子</span><span>一直整整齐齐放在屋的正中</span><span>放在仅有着一张桌子一张床的</span><span>我们之间</span></p></div>
