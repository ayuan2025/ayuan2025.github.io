    <p class="post-meta">—— 一九九四年</p>
    <h1>野菊花地</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>菊花和它们的花朵安静地呆在一起</span><span>这儿隔城市很远</span><span>使它们平心静气专心于生长和开放</span><span>一年接着一年</span></p>
<p class="stanza"><span>春天它们发芽</span><span>夏天它们开花</span><span>秋天它们播种</span><span>冬天它们休止</span></p>
<p class="stanza"><span>它们总是这样开着花</span><span>金黄色的花朵单调而热烈</span><span>无论我们对它使用剪刀</span><span>或是浇灌清水</span><span>它们永远都带着花朵的清香和纯洁</span></p>
<p class="stanza"><span>或者我们将它们插入瓶中</span><span>或在市场上兜售</span><span>它们都带着淡淡的微笑</span><span>永远拒绝任何形式的表现</span><span>固执地存在</span></p>
<p class="stanza"><span>—— 一九九四年</span></p></div>
