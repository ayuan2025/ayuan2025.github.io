    <p class="post-meta">—— 一九九五年三月六日</p>
    <h1>站在春天里的女子</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>夜鸢悄悄掠过了我们的头顶</span><span>一种黑暗的光线</span><span>在心河深处涉水而过</span><span>我们的瞳孔对之无知无觉</span></p>
<p class="stanza"><span>四月是一个眸子黑黑的女子</span><span>城外的花开得正好</span><span>她的裙是滚花金边</span></p>
<p class="stanza"><span>她在黑夜走过了那两棵高大的玉兰树</span><span>玉兰花便在她的背后落了下来</span></p>
<p class="stanza"><span>四月是一个风华正茂的女子</span><span>连规规矩矩的小步</span><span>也会带起一阵阵的轻风</span></p>
<p class="stanza"><span>她总是在暗地里才想起</span><span>她是一个短短的四月</span><span>她站在越来越短的春天里</span><span>舍不得离去</span></p>
<p class="stanza"><span>—— 一九九五年三月六日</span></p></div>
