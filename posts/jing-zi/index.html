    <h1>镜子</h1>
    <div class="tags"><span class="tag">岁月</span><span class="tag">雕刻</span><span class="tag">自省</span><span class="tag">镜中人</span></div>
  </header>
  <div class="post-body"><p class="stanza"><span>我看见镜子背面</span><span>苍老的脸</span><span>冬天一无所获</span></p>
<p class="stanza"><span>我看着日子</span><span>这片钝钝的刮胡刀</span><span>总是企图把我们雕刻成</span><span>它喜欢的模样</span></p>
<p class="stanza"><span>看来</span><span>我们得学会</span><span>如何与镜子交谈</span></p>
<p class="stanza"><span>—— 一九九七年十二月七日</span></p></div>
