    <h1>没有下雪的那个冬天</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>那个冬天</span><span>没有下雪</span><span>就像我们已经习惯了的那样</span><span>唯一不同的</span><span>是个女孩兴冲冲跑来说</span><span>她家的阳台上积了雪</span><span>当我明白她家的冰箱从不放到阳台上</span><span>以及商店里已经像人们习惯了的那样</span><span>不卖关于雪的画片</span><span>我才建议她最好到医院去挂个眼科号</span><span>但她那双大眼睛还是眨了眨</span><span>继续说她家的阳台上积了雪</span><span>据说她还尝了尝</span><span>不甜也不咸</span><span>只是像我们已经习惯的食品</span><span>有点过期的霉味</span><span>当然那还是雪　对不对</span><span>她抬起头继续问</span><span>我支吾着说那可能是吧</span><span>既然它不是白糖和盐巴</span></p>
<p class="stanza"><span>—— 一九九〇年</span></p></div>
