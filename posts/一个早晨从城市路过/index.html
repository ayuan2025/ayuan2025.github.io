    <h1>一个早晨从城市路过</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>一个早晨从城市路过</span><span>从郊外走进闹市</span><span>从一个宁静的梦境走近</span><span>挤满了人的火车售票处</span></p>
<p class="stanza"><span>我呼吸着充满了汽车尾气的城市味</span><span>看着年轻姑娘一群群从车厢中上上下下</span><span>年轻就是她们眸子里的光</span><span>她们像田野里的嫩草，清晨还带着露珠</span></p>
<p class="stanza"><span>城市的变化快呀，她们</span><span>过两年就会成为对面街上</span><span>两个正破口大骂的妇人</span></p>
<p class="stanza"><span>拥挤的人拥挤的城市拥挤的电梯</span><span>荷枪实弹的土兵只为拥挤的钞票</span><span>保驾护航</span><span>出租车又在罢工</span><span>街上走满</span><span>饥肠辘辘的匆忙上班人</span></p>
<p class="stanza"><span>—— 二〇〇一年二月五日</span></p></div>
