    <p class="post-meta">—— 一九九四年</p>
    <h1>围坐火炉</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>冬天又来了</span><span>我们又坐在火炉的四周</span><span>静静地看着火苗</span></p>
<p class="stanza"><span>外面下着雪</span><span>从中午直到黄昏</span><span>我们看到雪地里的玉米仓</span><span>独自向我们走近</span></p>
<p class="stanza"><span>我们像那两只</span><span>松树上的小东西</span><span>一点一点地</span><span>啃着坚硬的日子</span></p>
<p class="stanza"><span>这平静安闲由来已久</span><span>因为我们对于冬天</span><span>始终有着一种质朴的安居乐业</span></p>
<p class="stanza"><span>—— 一九九四年</span></p></div>
