    <p class="post-meta">—— 一九八八年四月</p>
    <h1>静物</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>盛满水的杯子</span><span>丰满圆润</span><span>不易为人察觉</span><span>就像一些很老的歌曲</span><span>尽管它们仍像当初一样动人</span></p>
<p class="stanza"><span>应该感谢天气或者</span><span>其它的一些什么</span><span>譬如</span><span>流逝的日子</span><span>是它们使我满足于</span><span>一些美好而简单的事物</span></p>
<p class="stanza"><span>1988.4</span></p></div>
