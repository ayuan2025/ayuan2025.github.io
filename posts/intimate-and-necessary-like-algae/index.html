    <h1>像藻类一样亲切和必需</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>鱼和爱情泅于243.6米的海底</span><span>按着既定的方向</span><span>向太阳伸展枝条</span><span>长着叶子的植物和裸露光洁皮肤的鱼人</span><span>在海底织网</span><span>打捞阳光和飞鸟</span><span>藻类安静地生长</span><span>带着岁月的倦意和信心</span><span>产生食物风景和爱情</span><span>这都是我们需要的东西</span><span>作为鱼人我们喜欢对情人说</span><span>你像藻类一样亲切和必需</span><span>鱼人们喜欢月光和沙滩</span><span>就像陆地人喜欢核导弹和太阳</span><span>我们长长的发飘于海中</span><span>像藻类一样亲切和必需</span></p>
<p class="stanza"><span>—— 一九九〇年十一月</span></p></div>
