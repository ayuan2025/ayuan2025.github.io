    <p class="post-meta">—— 一九九三年</p>
    <h1>每一个日子</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>每一个日子</span><span>都是无法再续的歌</span><span>我们围坐在这年的冬天四周</span><span>如同松果围绕着松树</span><span>鱼儿包围着河水</span></p>
<p class="stanza"><span>每一个日子</span><span>如同花瓣</span><span>在我们的掌中层层剥落</span><span>我们停留在玻璃窗的外面</span><span>呵出的热气</span><span>使镜面变得模糊</span></p>
<p class="stanza"><span>每一个日子</span><span>都是前来告别的朋友</span><span>他共享过我的骄傲和卑俗</span><span>在他离去的时候</span><span>没有留下字条</span><span>却碰响了家门口的风铃</span></p>
<p class="stanza"><span>—— 一九九三年</span></p></div>
