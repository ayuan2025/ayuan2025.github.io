    <h1>夏天,比溺水的女人更平静</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>夏天是一阵又一阵的盛开的阳光</span><span>比海浪更狂</span><span>比溺水的女人更平静</span></p>
<p class="stanza"><span>夏天</span><span>把花变成一种想象</span><span>把海风从房屋的另一面</span><span>吹进来</span><span>把唇边有着咸味的你</span><span>带来到了我们中间</span></p>
<p class="stanza"><span>夏天</span><span>把透明的梦境之门在你的身后打开</span><span>里面有着螺旋的石梯</span><span>向上</span></p>
<p class="stanza"><span>夏天,背对我们的扑克牌</span><span>正一张张打开</span><span>这是夏天</span><span>一切才刚刚开始</span></p>
<p class="stanza"><span>—— 二〇〇一年五月二十三日</span></p></div>
