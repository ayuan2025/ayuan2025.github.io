    <p class="post-meta">—— 一九九六年十一月四日</p>
    <h1>金子般的阳光</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我的指尖</span><span>掠过白云的阴影</span><span>阳光燃烧着两岸山脉</span></p>
<p class="stanza"><span>雅鲁藏布</span><span>一个醇厚高亮的女声</span><span>漫过黄沙野地</span></p>
<p class="stanza"><span>历史的碎片</span><span>在我的四周飞舞不去</span><span>片片经幡</span><span>在山口上猎猎作声</span></p>
<p class="stanza"><span>远山沉寂</span><span>迁移的沙丘终会</span><span>掩盖生者的灵魂</span></p>
<p class="stanza"><span>千年的酥油灯</span><span>也点不燃大昭寺外</span><span>金子般的阳光</span></p>
<p class="stanza"><span>—— 一九九六年十一月四日</span></p></div>
