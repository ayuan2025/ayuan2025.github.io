    <p class="post-meta">—— 一九八八年九月</p>
    <h1>写诗</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>写诗需要点昏黄的灯光</span><span>一支笔 几张白纸</span><span>余下的仅仅是空白</span><span>也就是说</span><span>在爱你不爱你之间</span><span>你是惟一的选择</span></p>
<p class="stanza"><span>空行不太多</span><span>不太密</span><span>需要一点点偏傍部首</span><span>在难以吟颂的部分中</span><span>栽些青草</span><span>让它们安静地生长着</span><span>惟一缺憾的是</span><span>我们过长时间的凝视</span></p>
<p class="stanza"><span>1988.9</span></p></div>
