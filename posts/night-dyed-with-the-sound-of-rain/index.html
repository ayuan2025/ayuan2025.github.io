  <header class="post-head">
    <p class="post-meta">—— 一九八九年</p>
    <h1>夜染雨声</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>怀念是一种简单的情绪</span><span>好同抚摸过久的木桌上</span><span>现出美丽的花纹</span></p>
<p class="stanza"><span>夜是只温暖的手</span><span>适合于些脆弱而飘渺的感情</span><span>它们转瞬即逝</span><span>但那眼神已刻骨铭心</span></p>
<p class="stanza"><span>雨是抚乱的鬓发</span><span>它们淅淅沥沥触摸树叶</span><span>而树沉默无语</span></p>
<p class="stanza"><span>梦是最甜的话语</span><span>每个夜里同榻共枕</span><span>起身已经将它背弃</span></p>
<p class="stanza"><span>譬喻是种很不恰当的东西</span><span>我们难以对譬喻</span><span>进行譬喻</span></p></div>
