  <header class="post-head">
    <p class="post-meta">—— 一九九五年十月六日</p>
    <h1>羁</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>在每个飘浮不定的叶子下面</span><span>都有一只看不见的手</span><span>颜色苍老的妇人</span><span>走过我眺望的青石大街</span></p>
<p class="stanza"><span>这是我们终会老去的秘密</span><span>枯黄、断裂</span><span>像头发离开我们的头皮</span><span>离开我们终日行走其上的土地</span></p>
<p class="stanza"><span>我们的身体还会保留一段时间</span><span>我们的话语人们也许还会记起</span><span>但我们早已离开</span><span>早已离开这条</span><span>青石铺成的大街</span></p></div>
