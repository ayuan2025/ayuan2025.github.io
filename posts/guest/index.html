    <p class="post-meta">—— 一九九七年九月十四日</p>
    <h1>客人</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>未来和松果一起到来</span><span>在这场和我们越来越近的雪里</span><span>不要太大声</span><span>它们还沉浸在</span><span>旅途的梦中</span></p>
<p class="stanza"><span>在我的指尖的河流</span><span>你能看见</span><span>血液正在冻结</span><span>这是一切都该休息的季节</span></p>
<p class="stanza"><span>97.9.14</span></p></div>
