    <p class="post-meta">—— 一九八九年</p>
    <h1>艳遇</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>那只是些平常的错误</span><span>就像是咖啡忘了放点糖</span><span>稍微有点苦</span><span>但你仍这般介意</span><span>我只好再尝一下</span><span>只是有点苦</span><span>如此而已</span><span>究竟有什么让你如此</span><span>恨恨看着我</span><span>加上块糖后</span><span>你用舌尖尝着</span><span>从来只会喝三合一的人</span><span>我摇了摇头</span><span>而你却突然站起来</span><span>张惶走开</span><span>拉住你小心地询问时</span><span>你却像小孩子般委屈地说</span><span>我从来不知道咖啡原来这么苦</span><span>而加上糖却如此好喝</span></p>
<p class="stanza"><span>—— 一九八九年</span></p></div>
