    <p class="post-meta">—— 一九九二年</p>
    <h1>瓷瓶</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我们就是早已失落的瓷瓶</span><span>却并未有他们想象的珍贵</span><span>我们已失落千年</span><span>与尘土为伍</span><span>在黑暗的砂粒之间格格不入</span><span>我们的外部已布满裂缝</span><span>我们终将碎去</span><span>我们的存在</span><span>已在史书中模棱两可</span><span>连同制造的人们</span><span>都叫做无法考证</span><span>也许明天</span><span>我们就会同尘土一样</span><span>毕竟我们和他们</span><span>具有相同的原子与构型</span><span>但在今天  作为瓷瓶</span><span>骄傲着我们身为瓷瓶</span><span>内部却空无一物</span></p>
<p class="stanza"><span>—— 一九九二年</span></p></div>
