    <h1>与书有关的诗</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>在那有些泛黄的叶片后面</span><span>究竟隐藏了些什么</span><span>越来越暗淡下来的日光下面</span><span>我读着你写下的</span><span>每一片薄薄的雪花</span><span>时光的手指一页页地翻过</span><span>我们那本匆匆的故事</span><span>怎么经得起</span><span>这一遍又一遍的检阅和注视</span><span>总是到了这样的最后</span><span>直到每盏灯光下飞舞的蛾群</span><span>都疲倦地睡去</span><span>那些苍白而脆弱的翅膀</span><span>才在我的掌上悄悄合拢</span><span>这样的夜色之中</span><span>那唱得最动情的歌</span><span>到了末了</span><span>也总是有不得不收藏起来的时候</span></p>
<p class="stanza"><span>—— 一九九四年八月十一日</span></p></div>
