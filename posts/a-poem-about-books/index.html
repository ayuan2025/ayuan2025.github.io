  <header class="post-head">
    <p class="post-meta">—— 二〇二五年十月二十九日</p>
    <h1>与书有关的诗</h1>
    
  </header>
  <div class="post-body"><p>在那有些泛黄的叶片后面 究竟隐藏了些什么</p>
<p>越来越暗淡下来的日光下面 我读着你写下的 每一片薄薄的雪花</p>
<p>时光的手指一页页地翻过 我们那本匆匆的故事 怎么经得起 这一遍又一遍的检阅和注视</p>
<p>总是到了这样的最后 直到每盏灯光下飞舞的蛾群 都疲倦地睡去 那些苍白而脆弱的翅膀 才在我的掌上悄悄合拢</p>
<p>这样的夜色之中 那唱得最动情的歌 到了末了 也总是有不得不收藏起来的时候</p></div>
