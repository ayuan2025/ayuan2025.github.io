    <p class="post-meta">—— 二〇〇一年四月八日</p>
    <h1>我看见</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>在窗台上</span><span>我看见阳光</span><span>把土瓶中的菊花</span><span>一片片皮肤剥开</span></p>
<p class="stanza"><span>更远的地方</span><span>透过树叶的摇动</span><span>我看见了风</span><span>它让残墙内开满鲜花</span></p>
<p class="stanza"><span>在海的表面</span><span>我看见了鱼的尸体</span><span>它们在夜的边缘浮现白光</span><span>让月亮黯然失色</span></p>
<p class="stanza"><span>在夜的背后</span><span>我看见</span><span>一只透明的鸟飞过</span><span>在它下面</span><span>那没有人的旷野</span><span>人们围着火堆跳舞</span></p>
<p class="stanza"><span>在玻璃的另一边</span><span>我看见</span><span>很多晶莹透明的骨头</span><span>在围着燃烧的骨头跳舞</span><span>我还看见</span><span>那些被遗忘的记忆</span><span>它们穿过了更远的人群而来</span></p></div>
