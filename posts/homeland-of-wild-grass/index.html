  <header class="post-head">
    <p class="post-meta">—— 一九九八年四月</p>
    <h1>野草的故乡</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>我怀疑</span><span>野草是岩石深处的血液</span><span>沿着大地坚硬的缝隙涌出</span><span>与候鸟一起跟随季节迁移</span><span>想占领每一寸的土地</span></p>
<p class="stanza"><span>我怀疑</span><span>是它和雨水侵入我的肺部</span><span>从我的牙根深处向外生长</span><span>塞住我的喉咙</span><span>让我沉默，让我窒息</span></p>
<p class="stanza"><span>野草没有故乡</span><span>但我怀疑</span><span>有个地方</span><span>正源源不断地向世界输送野草</span></p>
<p class="stanza"><span>—— 一九九八年四月</span></p></div>
