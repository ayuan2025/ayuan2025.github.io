  <header class="post-head">
    <p class="post-meta">—— 一九九六年</p>
    <h1>考虑</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>单薄的诗歌</span><span>或者其它的什么</span><span>类似</span><span>一个生命</span><span>它</span><span>或者过程</span><span>或者结束</span></p>
<p class="stanza"><span>雨在手心打住</span><span>故事在梦中瓦解</span></p>
<p class="stanza"><span>鸟在生活之外</span><span>鸣着</span></p>
<p class="stanza"><span>树叶落下的窗前</span><span>一次小小的疼痛</span><span>你捂住双手</span><span>平静地说</span></p>
<p class="stanza"><span>“疼痛无法避免</span><span>如同爱情”</span></p></div>
