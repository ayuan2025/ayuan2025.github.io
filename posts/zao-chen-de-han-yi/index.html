    <h1>早晨的寒意</h1>
    <div class="tags"><span class="tag">诗人</span><span class="tag">存在</span><span class="tag">诗魂</span><span class="tag">1998</span></div>
  </header>
  <div class="post-body"><p class="stanza"><span>离开了诗歌我就一无所有</span></p>
<p class="stanza"><span>当我割开冬天</span><span>就发现了你</span><span>是寒冷使我们远离了孤独</span></p>
<p class="stanza"><span>冰冷的我们</span><span>和满街光秃秃的木头一起不知所措</span></p>
<p class="stanza"><span>我在这个季节的日历中走着</span><span>一片玻璃在深海中滑过</span></p>
<p class="stanza"><span>—— 一九九八年二月二十七日</span></p></div>
