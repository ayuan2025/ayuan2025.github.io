  <header class="post-head">
    <p class="post-meta">—— 二〇〇一年八月十四日</p>
    <h1>写给非洲死难的儿童</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>夜徘徊在白天的边缘</span><span>远处有人在梦中锯断森林</span><span>饥饿的孩子们</span><span>赤足走向更荒凉的沙漠</span></p>
<p class="stanza"><span>被砍断的双腿</span><span>多过了疾病带来的苦痛</span><span>被砍伐的城市</span><span>超过了地震与火山的力量</span></p>
<p class="stanza"><span>埋葬、射杀和报复</span><span>谁都能比谁伤害得更深</span><span>不同肤色的上帝和仇恨</span><span>我们离未来越来越远</span></p></div>
