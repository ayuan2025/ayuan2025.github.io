    <h1>城堡</h1>
    <div class="tags"><span class="tag">生存</span><span class="tag">命运</span><span class="tag">阳光</span><span class="tag">孤航</span></div>
  </header>
  <div class="post-body"><p class="stanza"><span>你在夜的背面</span><span>开一扇窗口</span></p>
<p class="stanza"><span>每一道来到世界的阳光</span><span>都在你的手上经过</span></p>
<p class="stanza"><span>我们生存</span><span>或者仅仅活在</span><span>从早上的雨水</span><span>到半夜冷风</span><span>的狭缝间</span></p>
<p class="stanza"><span>命运</span><span>不过是</span><span>是一支支被我们</span><span>放逐的帆船</span></p>
<p class="stanza"><span>—— 一九九六年一月八日</span></p></div>
