    <h1>夜晚是一个名词</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>夜晚是一个名词</span><span>但却更像一间屋子</span><span>我想坐在里面</span><span>安静地坐在里面</span></p>
<p class="stanza"><span>夜晚是一段时间</span><span>但却更像一个情人</span><span>我想和她相守</span><span>一个人和她呆在一起</span></p>
<p class="stanza"><span>夜晚更像一条路</span><span>我们天天走过</span><span>却没有停下来</span><span>看看路边的风景</span></p>
<p class="stanza"><span>—— 一九九九年九月</span></p></div>
