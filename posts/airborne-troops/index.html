    <p class="post-meta">—— 一九九五年一月十日</p>
    <h1>空降部队</h1>
    
  </header>
  <div class="post-body"><p class="stanza"><span>（献给死去的法国空降士兵和那些勇于在绝望中生存的战士）</span><span>弹片和泥泞生长在你们的身体之上</span><span>像一堆又一堆渐渐蓬松的胡须</span><span>我们生活在一个遥远的国度</span><span>明天是一只想从窗口飞出的苍蝇</span><span>我们日复一日</span><span>明天总是太近</span><span>下一次的冲锋还远</span><span>我们远离了故乡和情人</span><span>来自高高的天空</span><span>而一切总是这样的平静</span><span>只有死神和我们比邻而居</span><span>我们总是静静等待着</span><span>他的敲门声响起</span><span>我们像一支支的蚂蚁</span><span>生存着</span><span>从葡萄酒到香榭里娜大街</span><span>这儿的机枪弹壳</span></p>
<p class="stanza"><span>—— 一九九五年一月十日</span></p></div>
