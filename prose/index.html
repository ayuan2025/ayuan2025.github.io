<script>window.BOOK={ kind: "prose", items: [{"t":"平静","d":"—— 二〇二五年十二月七日","g":null,"u":"/posts/ping-jing/","p":["这一段日子是很平常的，或者说有些平静，我想，每个人的生命中都会有过这样的一段时间，平静来得有点突然，可以说有点让人毫无准备，你一下子就轻松了下来，这种来自内心深处的平静，使得我们对于周围现实的考虑变得无足轻重。","这种时候，往往最容易想起的事却不是那些理念性的东西，那是我们时常思索而没有答案，只是在某些不经意和朋友闲聊时，忽地说了出来，有点像小时看魔术师表演，扑楞楞从帽子飞出的鸽子一般，就一两句话就说了自己从来无法用文字表达的东西。我好像是从记忆深处捞起了一些已经遗失了很久的，比如一个月以前的一个早上起床后总是记不起的在梦中写的一首好诗，童年时的一个下午，曾经许下的一个斩钉截铁的誓言。","它们忽地就清晰地浮上了记忆的表面，先是让你感到惊奇，然后就有点失望，因为这使你意识到你是如何从一个生活的陷井边一步步进入这个陷井中心的，童年是生活的受益者，因为他们是最接近事物的本质，简单和实用，彻彻底底的现实主义者，而随着年岁渐长，人也就愈来愈被卷入了人类制造的社会生活的核心，这是一种身不由已的改造，甚至无法察觉，因为你一直处于这种运动之中，所以无法仔细观察这种运动的目的和过程，只是到了一些时候，你的视线超越的栅栏，居然从外面透了进来，看到了现实中的自己，你才觉得有点奇怪，简直不明白原来的你是怎样一步一步走到现在这个自己的。","这就是说，我是忽然从远处看到我自己，这种说法有点让人费解，给人的的解释大概应该是从过去的自己一下看到了现在的自己，或者在梦中看到了生活中的自己，其实我是在一个晴朗的下午，一个人在人行道上闲逛，那是条宽阔的大街，但","几乎没有什么人，这是在我们这样的城市中很少见的，我就是这样走着走着，然后就看到了自己，这种体验是真实的，如同我在自己的玻璃茶杯里看到那上上下下浮沉的茶。","有时我想，我们就是这些不甘寂寞的茶叶，而生活本身也不过就是杯子里微微烫手的汤水而已。"],"m":""},{"t":"平静的生长","d":"—— 二〇二五年十月二十三日","g":null,"u":"/posts/ping-jing-de-sheng-zhang/","p":["我回过头去，那树很平静地生长着，而太阳缓缓，叶子间隙间显得很轻松，一切都很平静，青草安静而满足地生长着，在硫酸和烟尘间。风很轻，树叶微微有些晃动，情人般温柔，沙沙地声音。钢琴声很微弱，在所有的烟都抽完，所有鼓都打破之后，钢琴声很微弱，","但真实、令人信任，相信着有些东西很自在舒展着，令人羡慕。雨是一点一点落下来的。于是在很多时候我们会欣喜若狂，仅仅为了窗外那飞逝的阳光。于是在很多时候我们会黯然无语，仅仅为了一些风景太美丽、太脆弱。但我仍不会知道是否应该满足在风中疲倦地微笑，或者于独处时那温暖的烟头，尽管我已经有了那离不开的一些事物或人，在怀疑之时我才明白它们或他们是多么真实的存在。","风仍旧是蝴蝶般的美丽，但我怀疑，那青草伪善的颜色，它们冒充着血，掩盖那肮脏的地面，如你回首时的眼波掩盖着枯枝上畏缩的残叶。","即使在秋天，冷冷地在风中散步，偶尔的秋雨，它和我那样地亲近，但我没有表情；在秋雨之间，可以忘记些东西，譬如微笑与哭泣，在孤独的星球间走着，你如今总会相信我不会孤独，如果真的没有谁来陪伴。","偶尔有温温的太阳光，暮春的日子，尽管人们情愿或者不太情愿做出暧昧的微笑，我仍喜欢坐在微微枯黄的草丛中，假如你不担心感冒或者陪着叶间的小虫谈论些春天来了春天去了什么的，还有什么理由不在阳光下眯起眼来，晒晒你那苍白的额头。","没有理由不信任一些东西，热爱、拥抱，并且终生守护，它们简单、美好，没有太多的绮丽的色彩使你幻想、渴望、挣扎，如果你能够满足，它们就会让你满足。","陶渊明的菊花是一个奢侈，即使是那些淡色、山间的野花，但我仍象从前那样热爱着那黄色的菊花，花瓣不多，不太整齐，不香，没有什么美丽的名字，就当作一种奢侈，我想每天都能看见它们，揉碎它们的花瓣，躺在花丛中沉沉睡去，我有花盆、有水、有泥土、有白炽灯，但我仍愿意看见冷风中它们枯叶般脱落，即使明年不会再出来，我只坐在那茅屋前青石上，看着或者不看，陪着它们，尽管它们并不需要。有时，我必须满足人类浅薄的同情心，并且屈从。","我不能挥刀削去身后黯然的身影，就象削去日益杂乱丛生的胡须，但我能安心，如果有水，不一定是山间清冽的溪水，洗净些尘土，洗净身子，或者给门前干枯的野草浇些水，很多东西没有必要，只要不做作，即使做作，也没有什么。"],"m":""},{"t":"关于烟的流水帐","d":"—— 二〇二五年八月十四日","g":null,"u":"/posts/about-smoking-accounts/","p":["一直以为，抽烟是一件很私人的事情，也算是一种比较私人的需要或享受，最厌恶的就是把烟作为一种应酬，如同在饭桌拿着美酒赌酒互灌尝不出滋味一样，在应酬中的抽烟也是一种极大的浪费。 说来说去，抽烟是对身体有害的，但为什么有这样多的人需要，也是不好解释的。 先从自己的流水账说起吧。 第一次对烟有印象大概还没有入学，在家里的桌上找到包老爸的香烟，装模作样叼在嘴里，绕着当时住的平房神气活现的走了一圈，结果回家就被老爸K了一顿。","小学三四年级的时候，经常晚上在街上闲逛，不知是哪个同学买了一包劣质香烟，估计是和当时的《经济》差不多的牌子，几个同学点燃后，很得意在街上走着，以为点上烟自己就坏得很可爱很成熟了。 真正开始抽烟倒是高中的事了，不知为什么，上到高一的时候就很厌恶上课，也许是一天安排的课程太多，就经常挑自己特厌恶的语文和物理课逃，其实为什么逃这两门课也是有私心的，因为高中时特喜欢这两门课，不少内容早就自学完了，而且那两门课的老师讲的课我也不喜欢。通常逃课的流程是叫上两个好友，先到校门口的小摊凑钱买包烟，记得那时抽的烟多是《花溪》《大重九》之类。当时的中学旁边还没有开发，有不少农田和竹林，我们喜欢在天气好的时候，比方说秋日的暖阳，找个舒适的竹林，躺着抽烟，有一句没一句的闲聊。","真正养成抽烟的习惯是高三时晚上复习功课，每天10点钟左右就做完了功课，就倒在床上享受一支烟，然后剩下的时间就可以自己想写什么就写什么了。","就这样就到了大学，抽烟成了例行功课，担心到了月底的烟钱也成了一大烦恼，为了解决这个问题尝试了各种办法，比较搞笑的一次是，和好友趁在月初有钱的时候买上一包好烟放在箱子底，计划到了月底的时候再抽，结果到了月底真的忘了这回事，直到月底在寝室里翻箱倒柜准备找点粮票去换烟抽的时候，发现居然还有一包烟，高兴死了。"],"m":""},{"t":"蝴蝶小姐","d":"—— 二〇二五年八月十四日","g":null,"u":"/posts/hu-die-xiao-jie/","p":["蝴蝶小姐是位住在镜子宫殿的公主，她喜欢在静静的深夜里一个人穿着每一件美丽的衣服在她那以镜子砌成的墙壁间以各种姿势走来走去，这段时间是她一天中最美的时候。","每天夜里这个时候，如果你悄悄地从门缝里看，就会看见她美丽的脸庞和闪闪发光的眸子正聚精会神地看着镜中的自己，那认真的神态就是一位科学家看着显微镜下的切片，那痴情的目光会让你怀疑她的对面正站着世界上最伟大的情人，偶尔，你会发现她会微微皱一下眉毛，喔，请不要担心，那是她发现了她的新装有那么一小点毛病，也许是有一点不太合身，也许……原来这一次是和她的鞋子有一点不相配，不过，这类的小问题她能很快地就解决，她会飞快地从她几百双鞋里找出一双，当然，即使都还不行，她还可以明天找遍这个城市的所有鞋店。果然，我们的蝴蝶小姐从她的鞋柜中找到了一双合适的鞋，她高兴地在环绕着她的镜子面前踱着步，故意将鞋提得很高，糟糕，她又停了下来，皱紧了眉头，原来，这一次是她的发夹出了问题……","在白天，和我们众多的小姐女士一样，蝴蝶小姐最喜欢的就是在城市每一个角落的时装店，她可以如数家珍地告诉你在那条巷子尽头有什么什么样的时装店，专卖什么什么风格的服装，蝴蝶小姐令人佩服的事还很多很多，她可以在包里只有一毛钱的时候把这个城市里展览的每件时装都试穿在身上，然后，找出它们的毛病。","蝴蝶小姐一生中最伟大的梦想就是希望能变成一支蝴蝶，当然是世界上最美丽的一种，不过，有一次听到她的一个朋友说的话她就放弃了这个想法。","那个朋友说：“其实，蝴蝶也是挺可怜的，你想，它一辈子都只能穿着一件衣裳，就是再美丽又有什么意思。”"],"m":""},{"t":"章鱼先生","d":"—— 二〇二五年八月十四日","g":null,"u":"/posts/zhang-yu-xian-sheng/","p":["章鱼先生是我们所敬爱的教育战线工作者的一员，在小学的石板讲台上，他用桑枝条教我们１２３４５６７，在中学他教我们方程式，在大学教我们微积分，而最近，他正热衷于研究着一个简单的数列。","为此，导师邀请我到他家里去一起研究一下，对此，我深感荣幸。门铃响过三声后，章鱼先生一只触角拿着电话筒，一只触角抓着个只剩了一半的通讯录，当然，还有一只触角给我开了门。随即，用一只触角在一块小黑板上龙飞风舞地写下了一排字符：","Ｍ＝Ｎ１ＰＡ％＋Ｎ２ＰＢ％＋Ｎ３ＰＣ％＋......ＮnＰＺ％","然后，这位昔日的数学导师放下了话筒，从他的神情我发现他十分的忙碌，但我还是请求他再给我讲解一下这个貌似简单的数列。","“事实上，”章鱼先生用他的习惯语开了头：“这是个简单的数列，也就是说一个在平面上是三角形，立体上呈金字塔形的一个数字传递公式。但是如果在传递的过程中加上一个价值，例如我们这个商品社会所通用的ＭＯＥＮＹ，那么，Ｍ就代表着你的收入，而Ｎ１就是你的下线，Ｎ２就是你的下下线，以此类推，Ｐ则是一个恒定的常数，也就是一个商品所标示的价格，Ａ％、Ｂ％等，则是一个可变化的百分率，也就是这个数列中最神奇的东西。”","说到这里，章鱼先生用他的嘴附在我的耳朵上悄悄地说：“上面这个数列实际上只是一个最初级的阶段，如果你的Ｎ１＋Ｎ２＋Ｎ３＋...＋Ｎn大于或等于了一个常数Ｃ，那么你的％将大幅度的上升。那时候，你只需要坐在家中，你的Ｍ就会不断地上升、上升、上升。”","章鱼先生连说了三个上升，他的眼也直直望到天花板上，仿佛他已经坐在了那金字塔的顶上，用他那忙碌的触角点着那厚厚的一沓Ｍ。","世上真有这样好的事情，我激动得眼睛都有点花了，我不择字句地问：“我怎样才能也得了这样的一个Ｍ？”","章鱼先生很老成地把腰向后仰了仰，漫不经心地回答道：“这是个很简单的事，只要你成我的Ｎ１中的一员，你看看。”","章鱼先生把他触角一直抓着的那个通讯录给我看了看，我在揉皱的一角发现了自己的名字，然后章鱼先生小心谨慎的将嘴靠近我的耳朵，生怕被邻居们听见了这个秘密，","轻轻地对我说：“这里面有很多很多的Ｎ１。”"],"m":""},{"t":"多年前随手的短文","d":"—— 二〇二五年八月十三日","g":null,"u":"/posts/duo-nian-qian-sui-shou-de-duan-wen/","p":["夜深了，机箱里的风扇静静地响着，数据流飞快地从世界的另一端向着我的硬盘高飞，它们把电影和音乐带到我不堪负荷的硬盘里，在另一面，我和深夜里不眠的另一些人用键盘聊着，这些聊天把我分割成无数碎片，因为有人在说感情，有人在说生活，有人在说工作，在这种碎片飞舞的夜晚过后，我决定回到我自己，于是在25点，我把所有的聊天软件全部关掉，屏幕终于安静了下来，不再有一个个小窗口在不停地分割我的视窗。","我在自己的桌面上停留了几分钟，呆呆地看着那张墙纸，然后打开了记事本，记事本有着一种平平静静的空白，这很让我喜欢，就像是一张等待着笔迹的白纸，于是，我决定随便打几个字上去，这就是现在这篇文章的开头。","冬天的街边，细细的雨丝绵绵地落在地上，让本来就不太干净的街道显得有点脏，天边暗暗的，汽车在小街里挤成一团，谁也走不了，我无奈地而迅速地走着，希望快快的行走能把这一切丢在背后。","这是只是一个冬天的角落，而这个冬天的日子，也只是一个冬天的开始，所以在空气里并没有寒风刺骨的感觉，但却是夜晚来得最快的时候，而每天的早晨和黄昏，也不再有令人感动的颜色，所谓黄昏，也仅仅留下来的一个名称，因为在这时，天早已暗了下来。","这种季节，我们需要读点什么书，在冬夜里避开寒冷，在书中避开世界。","但我们依然面对满满的书架开始发楞，因为里面每一本书都像是一个个幽黑的通道，每一个通道都是从这间小屋，这个世界到达另一个地方的道路，每一条道路都会把我们带离我们的生活轨道，在这样繁多的道路面前，我已经迷失了，我没有勇气去打开那一扇门。于是我只好随便抽出一张CD，倒在床上听，让睡眠把我带到另一个世界。"],"m":""},{"t":"小狗憨豆","d":"—— 二〇二五年八月十一日","g":null,"u":"/posts/silly-dog-bean/","p":["憨豆是一只在我们家呆了两年多的土狗，所谓土狗，其实学名应该叫中华田园犬，我家以前也养过两只据说是很正宗的中华田园犬，父母都是纯种的中华田园犬，从小是吃牛奶和狗粮长大，满月后是朋友从外地专门驱车送来的，他们个头比一般的土狗高大，短毛，腿长头高，非常漂亮，不少朋友看了都不相信是土狗。而憨豆的出身就没有那样显赫，因为它是一只很正宗的土狗，出生在距离我们家不远的一处农家，虽然它的母亲身材高大，但父亲是谁也不知道。憨豆是那一窝的老大，但好像发育得弟弟们慢，当我们看到时，他个头比弟弟们大不少，但嘴吻都没有长出来，加上一身都是长长的胎毛，看上去不像一只狗，倒像是一只熊。","憨豆来到我们家，从小就开始了看家护院的工作，当时家里另有两只哈士奇，因为哈士奇经常乱跑，我们一般就关在狗舍里，而憨豆则从小享有自由的权利，不仅前院后院的跑，还经常趁我们不在，偷偷溜出去玩。","最令家里人觉得好笑的是，因为憨豆自己觉得自己很自由，而其他的狗都是关起的，恍惚中觉得自己是一只牧羊犬，那两只狗则成为了它放牧的对象，每当我们去后院放狗出来玩的时候，憨豆就跟着我们一路，走到狗舍前，它就对那两只狗吠叫一阵，那意思似乎是在警告它们，你们一会出来要老老实实的，不要犯错。而当那两只狗出来后，它也经常跟前跟后地守着，生怕那两只狗跑丢一样。每当这个时候，儿子土豆就经常笑着说，看，憨豆又以为自己是牧狗犬了。这种情况发展到后来就更夸张，因为我们一回家，一般都要放狗儿出来玩，所以到了后来，只要当我们一回家，憨豆就会忘了和我们打招呼，而是直接跑到后院去对着那两只狗狂叫了。","憨豆有很多可爱的地方，这些优秀的地方一方面是土狗的优良传统，另一方面就是因为从小就有自由养成的好习惯，憨豆从小时就到后院铁门外去拉屎，从来不会给我们带来清洁上的麻烦，当它长大后，无法从铁门栏杆的缝隙中钻出去，它就走到马路对面的荒地去解决问题，这让我们很担心，马路上车来车往的，万一被车撞了怎么办？憨豆另一个好习惯是从来不调皮，它不会咬门前的拖鞋，不会去踩晾在地上的辣椒，它也很知道自己的分寸，比如我们不让它进屋，它就在门口的垫子睡着，直到我们关门它才起身守在门外。","憨豆也有些让人头痛的缺点，最大的缺点是太胆小，每当它听到鞭炮声便会吓得跑到屋里来，最怕的时候会直接一头钻进床下面，如果说怕鞭炮还情有可原的话，另一种情况就是过于懦弱，失去了看家狗的功用了，每当有生人来的时候，它便会一声声叫，然后一步步地后退，往后院跑，从小到大都是如此，这也让我们很失望，最后只好另外买了一只猛犬罗威那来看家。憨豆的另一个缺点是不爱洗澡，也许是小时候洗澡太少，长大了后看见我们在准备洗澡工具时就偷偷跑掉了，甚至有两次，我准备用链子套住它，它也拼命挣扎跑开。","我总觉得，憨豆虽然天天和我们在一起，但在它的心目中，一直有一种奇怪的戒备，一种对主人不应该有的戒备，它很少像其他的狗一样对主人完全没有戒心，在地上翻滚着肚皮和你玩，它总是观察着你，生怕做错了什么事一样。我猜测，因为它经常跑出去，也许是在外面被人欺负过，所以对于人类，都有着很深的戒备。这一点，从有个小事上可以看出来。有一天，家里的厨房发现了一只老鼠，为了把老鼠就地正法，我们找来找去，后来老鼠跑到了洗衣机和冰箱的背后，我们束手无策之后，想到了把憨豆抱进来，希望它能把老鼠给撵出来，但令人郁闷的事发生了，憨豆它居然因为害怕，不知道我们为什么要把它抱进厨房，而在厨房的地上，吓得流了尿。","憨豆是在一天晚上跑丢的，说是跑丢也很奇怪，它实际上是去追家里跑出去的那只哈士奇的，平常几分钟后，它都会追着哈士奇一起回家，但这一次，哈士奇跑了一圈就先回来了，憨豆还是没有回来，后来，哈士奇又跑出去了一圈，还是没有把它带回来，我们都以为它是调皮，在外面玩一夜第二天就会回家，但憨豆一直就再没有回来过。老婆说憨豆是早准备离家出走了，然后找了个看起来光明正大的机会跑出去了，但我总觉得怪怪的，第二天，第三天，在它平常爱跑的地方找了几遍，都没有发现任何踪迹，只能相信，它是真的离家出走了，但愿它能好好活着，但一只离开了家的狗，无论如何都无法让人放心，也无法相信，它会有一个衣食无忧的生活。"],"m":""}] };</script>
