<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐 · 阿元的自留地</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/assets/css/style.css?v=mu6vkc77">
<link rel="stylesheet" href="/assets/css/music.css?v=mu6vkc77">
</head>
<body class="page-music-index">
<nav class="masthead">
  <a class="brand" href="/">阿元的自留地</a>
  <div class="nav-links">
    <a href="/poetry/">诗集</a>
    <a href="/prose/">散文</a>
    <a href="/fiction/">小说</a>
    <a href="/tech/">技术</a>
    <a href="/music/">音乐</a>
  </div>
  <button id="themeToggle" aria-label="切换深浅模式">◐</button>
</nav>
<main class="wrap">
  <div class="music-head">
    <h1>音乐</h1>
    <p class="music-sub">唱出来的诗 · 点击唱片开始</p>
  </div>
  <div class="shelf-layout">
    <div class="deck">
      <div class="disc-wrap">
        <div class="disc" id="disc"><span class="disc-label" id="discLabel"></span></div>
        <span class="tone-arm" aria-hidden="true"></span>
      </div>
      <div class="deck-meta">
        <p class="deck-title" id="deckTitle">选一首，唱给你听</p>
        <p class="deck-dur" id="deckDur"></p>
      </div>
      <button class="lyr-back" id="lyrBack" type="button">← 曲目列表</button>
    </div>
    <div class="deck-stage" id="deckStage">
      <div class="song-list" id="songList"></div>
      <div class="deck-lyrics">
        <div class="lyrics-box"><div class="lyrics" id="lyrics"></div></div>
      </div>
    </div>
  </div>
</main>
<script src="/assets/js/main.js?v=mu6vkc77"></script>
<script src="/music/songs.js"></script>
<script src="/assets/js/music.js?v=mu6vkc77"></script>
</body>
</html>
