<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐 · 阿元的自留地</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/assets/css/style.css?v=mu716qa8">
<link rel="stylesheet" href="/assets/css/music.css?v=mu716qa8">
</head>
<body class="page-music-song">
<nav class="masthead">
  <a class="brand" href="/">阿元的自留地</a>
  <div class="nav-links">
    <a href="/poetry/">诗集</a>
    <a href="/prose/">散文</a>
    <a href="/fiction/">小说</a>
    <a href="/tech/">技术</a>
    <a href="/music/">音乐</a>
  </div>
  <button id="themeToggle" aria-label="切换深浅模式">◐</button>
</nav>
<main class="wrap">
  <div class="song-page">
    <a class="song-back" href="index.html">← 唱片架</a>
    <div class="song-layout">
      <div class="song-left">
        <div class="disc-wrap">
          <div class="disc" id="disc"><span class="disc-label" id="discLabel"></span></div>
          <span class="tone-arm" aria-hidden="true"></span>
        </div>
        <div class="song-meta">
          <h1 id="songTitle">—</h1>
          <p class="sub" id="songSub"></p>
        </div>
        <div class="ctrl">
          <button class="pv" id="prevSong" aria-label="上一首">‹</button>
          <button class="play-btn" id="playBtn" aria-label="播放/暂停">
            <span class="ico-play">▶</span><span class="ico-pause">⏸</span>
          </button>
          <button class="nx" id="nextSong" aria-label="下一首">›</button>
        </div>
        <div class="bar">
          <input type="range" id="seekBar" min="0" max="1000" value="0" aria-label="进度">
          <div class="bar-time"><span id="tCur">00:00</span><span id="tAll">00:00</span></div>
        </div>
      </div>
      <div class="lyrics-box"><div class="lyrics" id="lyrics"></div></div>
    </div>
    <div class="tune-bar" id="tuneBar">
      <b id="tuneCur">第 1 行 · 00:00</b>
      <button id="tSelPrev">◀ 上一行</button>
      <button id="tMark">标记行首</button>
      <button id="tSelNext">下一行 ▶</button>
      <button id="tShift">设为第 1 行并平移全部</button>
      <button id="tCopy">复制轴 JSON</button>
      <span class="tune-hint">拖进度到该行开口的那一瞬点「标记行首」；第一句校准后可整体平移，再逐行微调。完了把 JSON 发给 AI。</span>
      <textarea id="tuneOut" readonly></textarea>
    </div>
  </div>
</main>
<script src="/assets/js/main.js?v=mu716qa8"></script>
<script src="/music/songs.js"></script>
<script src="/assets/js/music.js?v=mu716qa8"></script>
</body>
</html>
