<script>window.BOOK={ kind: "prose", items: [{"t":"当大厂都下场做输入法后，如何既要还要","d":"—— 二〇二五年十二月七日","g":null,"u":"/posts/dang-da-chang-dou-xia-chang-zuo-shu-ru-fa-hou--ru-he-ji-yao-hai-yao/","p":["像我们这种少有的五笔用户，一直是被嫌弃的，大部分输入法都是针对拼音用户，在刚开始有windows的时候，还被逼无奈，自己编译码表生成输入法来用。电脑科技发展了这么多年，输入法一直是挣钱的类别，包括著名的极点也一直是免费的，很少有什么大厂来开发。但现在的手机时代完全不一样了，拥有输入法就可以掌握了太多的个人数据，不光是你的输入数据，还有大量的剪贴板数据，涉及到太多了个人敏感信息，如身份证号、手机号和银行账户等等。这些个人信息出卖了你的购物偏好、地址等等，黑产行业的人拿来可以直接卖钱。输入法在现在如此重要，大厂们也不闲着，纷纷下场了，前有微信输入法，后有豆包输入法。","我一直用的离线版的百度输入法，但最近升了级，离线版语音功能又不能用了，这次换回小企鹅输入法。国内大厂的输入法不敢用了，以前最典型的一个场景就是在一个购物平台上搜索了什么，切换到另一个平台，马上就推送相同的产品，让人细思极恐，这都是输入法出卖了自己。","国际大厂的微软没有五笔，只有谷歌输入法有语音识别，缺点就词组少一点，这一点还可以通过增加自定义词组解决，但无法自定义码表无法增加五笔拼音混输，也没有自动造词。","因为电脑上一直用的rime和小狼毫，手机上的同文以前就试过，词组和码表很好，界面太丑，要实现语音输入功能太难。","小企鹅以前用过很久，作为RIME的分支很多地方比原生还好，这次在ai指导下，使用了小企鹅输入法添加谷歌语音输入按钮弥补了短版。实现方法很简单。 先去Google商店里安装谷歌语音输入法，然后再在小企鹅的输入法设置里面打开语音输入按钮，输入法右上角就有一个小的麦克风标志。 使用时很简单。点这个按麦克风按钮 输入法就切换到了Google语音输入法，直接说话就可以了，说完了点左上角返回键就可以回到小企鹅输入法界面继续编辑， 虽然没有微信输入法和百度输入法那样的长按空格就能语音输入方便，但数据放在那些大厂手里心里真不放心。","感谢那些一直做开源的大佬们：","中州韻輸入法","https://rime.im/download/","小企鹅输入法","https://fcitx-contrib.github.io/","rime 墨奇版 五笔整句输入方案","https://github.com/gaboolic/rime-wubi-sentence"],"m":""},{"t":"一键智能批量重命名美剧字幕 ","d":"—— 二〇二五年十一月十三日","g":null,"u":"/posts/生产力total-commander-powershell一键智能批量重命名美剧字幕/","p":["背景痛点","作为美剧爱好者和 Total Commander (TC) 的重度用户，我经常遇到这样的情况： 下载了一整季的美剧（比如《猎魔人》），视频文件名是规范的 `S04E01` 格式，但下载的字幕文件通常名字乱七八糟，或者带有各种后缀。","如果直接按列表顺序批量重命名，一旦视频和字幕的排序不一致（比如一个按时间排，一个按名字排），就会导致字幕张冠李戴 。","我需要的是一个智能方案 ：","1. 正则匹配 ：自动识别视频和字幕中的 `SxxExx`（季数+集数）编号进行匹配，而不是傻傻地按顺序改名。\r\n  2. 一键操作 ：在 TC 里点击一个按钮瞬间完成。\r\n  3. 支持 NAS ：必须能直接在网络共享路径（SMB/UNC路径）下工作，不需要映射盘符。","经过反复调试（踩了不少坑），终于用 PowerShell 完美解决了这个问题。","解决方案：SmartRename.ps1 脚本","这个脚本会自动扫描当前目录下的视频和字幕，提取 `SxxExx` 进行配对，并将字幕重命名为与视频同名（保留字幕后缀）。","1\\. 创建脚本","在你的电脑任意位置（例如 `D:\\Tools\\Scripts\\`）新建一个文本文件，重命名为 `SmartRename.ps1`，复制以下代码：","param([string]$TargetDir)","--- 1. 修复路径问题 ---\r\nif ($TargetDir) { \r\n    $TargetDir = $TargetDir.Trim().TrimEnd('\\')\r\n}","--- 2. 设置编码和跳转 ---\r\n[Console]::OutputEncoding = [System.Text.Encoding]::UTF8","if ($TargetDir) {\r\n    Write-Host \"Path: [$TargetDir]\" -ForegroundColor DarkGray\r\n    try {\r\n        Push-Location -LiteralPath $TargetDir -ErrorAction Stop\r\n    }\r\n    catch {\r\n        Write-Host \"Error: Can't access directory.\" -ForegroundColor Red\r\n        exit\r\n    }\r\n}","Write-Host \"Work Dir: $PWD\" -ForegroundColor Magenta","--- 3. 扫描文件 ---\r\n$videos = Get-ChildItem -File | Where-Object { $_.Extension -match \"\\.(mkv|mp4|avi)\" }\r\n$subs = Get-ChildItem -File | Where-Object { $_.Extension -match \"\\.(ass|srt|ssa|vtt)\" }","if ($subs.Count -eq 0) {\r\n    Write-Host \"No subtitles found.\" -ForegroundColor Yellow\r\n    Read-Host \"Press Enter...\"\r\n    exit\r\n}","--- 4. 自动判断模式 ---\r\n$isTvShow = $false\r\nforeach ($v in $videos) { if ($v.Name -match \"(?i)(S\\d+E\\d+)\") { $isTvShow = $true; break } }\r\nif (-not $isTvShow) { foreach ($s in $subs) { if ($s.Name -match \"(?i)(S\\d+E\\d+)\") { $isTvShow = $true; break } } }","--- 5. 执行重命名 ---\r\nif ($isTvShow) {\r\n    # [美剧模式]\r\n    Write-Host \"Mode: TV Show (SxxExx)\" -ForegroundColor Cyan\r\n    foreach ($video in $videos) {\r\n        if ($video.Name -match \"(?i)(S\\d+E\\d+)\") {\r\n            $code = $matches[1]\r\n            $targetSub = $subs | Where-Object { $_.Name -match \"(?i)$code\" }\r\n            if ($targetSub -and ($targetSub.BaseName -ne $video.BaseName)) {\r\n                $newName = $video.BaseName + $targetSub.Extension\r\n                Rename-Item -Path $targetSub.FullName -NewName $newName -ErrorAction Stop\r\n                Write-Host \"OK: $code -> $newName\" -ForegroundColor Green\r\n            }\r\n        }\r\n    }\r\n} elseif ($videos.Count -eq 1) {\r\n    # [电影模式]\r\n    Write-Host \"Mode: Movie (Single Video)\" -ForegroundColor Cyan\r\n    $baseName = $videos[0].BaseName\r\n    foreach ($sub in $subs) {\r\n        if ($sub.BaseName -ne $baseName) {\r\n            $newName = $baseName + $sub.Extension\r\n            Rename-Item -Path $sub.FullName -NewName $newName -ErrorAction Stop\r\n            Write-Host \"OK: Movie -> $newName\" -ForegroundColor Green\r\n        }\r\n    }\r\n} else {\r\n    Write-Host \"Unknown Mode: No SxxExx found and not a single video file.\" -ForegroundColor Red\r\n}","Write-Host \"✨ 全部处理完成！窗口将在 5 秒后自动关闭...\" -ForegroundColor Yellow\r\nStart-Sleep -Seconds 5","使用效果","设置好后，进入 NAS 里的美剧文件夹，点击按钮：","1. 脚本会自动弹出黑框。\r\n  2. 自动跳转到 NAS 路径（显示 `Push-Location` 成功）。\r\n  3. 自动识别 `S01E01` 这种编号。\r\n  4. 瞬间把乱七八糟的字幕改成和视频完全一致的文件名。","哪怕你的字幕列表是倒序的，视频是正序的，它也能精准匹配，绝不出错。","* * *","希望这个小工具能帮到同样喜欢折腾 NAS 和整理媒体库的朋友！"],"m":""},{"t":"日历壁纸 (Calendar Wallpaper)","d":"—— 二〇二五年十月二十九日","g":null,"u":"/posts/calendar-wallpaper/","p":["自己写的日历壁纸 (Calendar Wallpaper)软件","这是一个日历壁纸应用，旨在为用户提供个性化和功能丰富的桌面壁纸体验。该应用的核心功能包括：","主要功能\r\n1.\t多源壁纸支持：\r\n⦁\t支持从在线平台（如 Pexels）获取壁纸，并大幅扩展壁纸库以增加多样性。\r\n⦁\t新增本地文件夹作为壁纸来源，用户可自定义本地壁纸路径，并支持随机或顺序切换。\r\n2.\t智能日历叠加：\r\n⦁\t在壁纸上叠加显示当前月份的日历，并优化了日历的显示效果，解决了中文乱码、更新重叠和日期高亮不准确等问题。\r\n⦁\t日历字体、大小和位置（左上、右上、左下、右下）均可自定义。\r\n3.\t提供一键收藏功能，用户可将喜欢的壁纸保存到指定收藏夹，收藏壁纸不会被自动清理，并可设置概率优先显示。\r\n⦁\t优化壁纸文件大小，控制在2MB以内，并定时清理工作目录中的原始壁纸以节省资源。\r\n⦁\t可选功能：壁纸更新后自动退出，不占用系统资源。","https://github.com/ayuan2025/pexels_wallpaper/releases/download/1.1/calendar_wallpaper.exe"],"m":""},{"t":"键盘之爱","d":"—— 二〇二五年八月十五日","g":null,"u":"/posts/love-of-keyboard/","p":["从人类开始疏远笔和纸开始，键盘就一直是主要的输入工具，就像在钢笔时代，国外有派克、万宝龙、凌美，国内有英雄、永生，追求的就是书写的流畅和良好的握感，而现在，却很少有人讨论键盘。我最早的电脑是配的机械式键盘，台湾的compaq，虽然当时没有觉得这个键盘有多么好用，但和后来的电容式键盘相比完全是两种手感。94年的时候，单位上花了两万买了一台IBM电脑，键盘给我留下了深刻的印象，至今我还怀念在那上面打字时那种行云流水的感觉。电脑配置越来越好，而且我也专挑的罗技、微软和DELL的键盘在用，但他们的手感一直让我不太舒服。曾经为了使用以前的老键盘，因为接口大小不一，还专门找了转接线来接上使用，还好现在机械键盘普及了，一两百都能随便买。","之前买过ThinkPad，就是因为他家的键盘手感是最好的，只是声音也比一般的键盘大一些，现在用的苹果记本虽然轻薄，但打字的确不舒服。","在另一方面，手机键盘也是如此，我最怀念的还是Palm 650的手机，我开会不用笔记本，也能快速记录，这源于它好用的全字符键盘，后来也用过Centro，键盘偏软，让人输入时拖泥带水，很是不爽。同时代的黑莓、诺基亚的E系列手感也不错。但之后的侧滑或翻盖键盘手机就不方便用了。","时代总是滚滚向前，现在已经忘了曾经有过全键盘手机那么方便打字。现在的都是虚拟键盘，语音输入也越来越方便。说起语音输入，我很希望语音输入能够增加一个新的功能，自动把语音输入时的口语助词等自动清理并改正一些常见的错误。其实有一款软件叫get笔记有类似的功能，这应该是未来的一种方向。"],"m":""}] };</script></main>
