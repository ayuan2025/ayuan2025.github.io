<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 阿元的自留地</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">
<link rel="stylesheet" href="/assets/css/style.css?v=mu6lrmo0">
<style>
/* 入场前的底色：与本页纸色一致，从书架跳过来时不闪白
 * 写在这里是为了在 style.css 之前就生效；--paper 由 style.css 定义，
 * 而 <link> 是渲染阻塞的，body 渲染时变量一定已就位。 */
.boot-veil { position: fixed; inset: 0; z-index: 9998; pointer-events: none;
  background: var(--paper); opacity: 0; transition: opacity .38s ease-out; }
html.book-boot .boot-veil { opacity: 1; }
</style>

</head>
<body class="page-home">
<div class="boot-veil" id="bootVeil"></div>

<nav class="masthead">
  <a class="brand" href="/">阿元的自留地</a>
  <div class="nav-links">
    <a href="/poetry/">诗集</a>
    <a href="/prose/">散文</a>
    <a href="/fiction/">小说</a>
    <a href="/tech/">技术</a>
    <a href="/music/">音乐</a>
  </div>
  <button id="themeToggle" aria-label="切换深浅模式">◐</button>
</nav>
<main class="wrap">
<section class="desk-stage">
  <div class="desk">
    <div class="desk-lamp"></div>
    <div class="desk-ring"></div>
    <h1 class="desk-title">阿元的<span class="accent">自留地</span></h1>
    <p class="desk-sub">写诗、散文、小说，偶尔也折腾技术 · 桌上共 98 篇</p>
    <div class="book-stack">
    <div class="spine" data-cat="poetry" data-href="/poetry/" data-label="诗集"
         role="link" tabindex="0" aria-label="打开诗集，共 82 篇"
         title="诗集 · 82 篇 — 每一首，都是一页">
      <span class="spine-title">诗集</span>
      <span class="spine-tag">82</span>
    </div>
    <div class="spine" data-cat="prose" data-href="/prose/" data-label="散文集"
         role="link" tabindex="0" aria-label="打开散文集，共 7 篇"
         title="散文集 · 7 篇 — 生活的十三种解释">
      <span class="spine-title">散文集</span>
      <span class="spine-tag">7</span>
    </div>
    <div class="spine" data-cat="fiction" data-href="/fiction/" data-label="小说集"
         role="link" tabindex="0" aria-label="打开小说集，共 5 篇"
         title="小说集 · 5 篇 — 虚构的隧道">
      <span class="spine-title">小说集</span>
      <span class="spine-tag">5</span>
    </div>
    <div class="spine" data-cat="tech" data-href="/tech/" data-label="技术笔记"
         role="link" tabindex="0" aria-label="打开技术笔记，共 4 篇"
         title="技术笔记 · 4 篇 — 工具与折腾">
      <span class="spine-title">技术笔记</span>
      <span class="spine-tag">4</span>
    </div>
    <div class="spine cd" data-cat="music" data-href="/music/" data-label="音乐"
         role="link" tabindex="0" aria-label="打开音乐唱片架，共 8 首"
         title="音乐 · 8 张唱片 — CD 架">
      <span class="cd-label"><span>音乐</span><b class="cd-count">8</b></span>
    </div>
    </div>
    <p class="desk-hint">点一本书脊，翻开看看</p>
    <div class="desk-actions">
      <a class="blindbox-btn" href="/random.html">随手翻开一篇</a>
    </div>
  </div>
</section>

<div class="flip-overlay" id="flipOverlay" aria-hidden="true">
  <div class="fly-book" id="flyBook">
    <div class="fly-page" id="flyPage"><span class="fly-page-title" id="flyPageTitle"></span></div>
    <div class="fly-cover" id="flyCover">
      <div class="fly-cover-face" id="flyCoverFace"></div>
      <div class="fly-cover-back"></div>
    </div>
  </div>
  <div class="fly-cd" id="flyCd" aria-hidden="true">
    <div class="fc-base"></div>
    <div class="fc-disc"></div>
    <div class="fc-lid"></div>
  </div>
</div>
<script src="/assets/js/desk.js?v=mu6lrmo0" defer></script></main>
<script src="/assets/js/main.js?v=mu6lrmo0"></script>
</body>
</html>
